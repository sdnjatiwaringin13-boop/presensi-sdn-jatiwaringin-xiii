<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pengaturan Sekolah</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
    }

    .container {
      width: 95%;
      max-width: 700px;
      margin: 40px auto;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-save {
      background: #2563eb;
      color: white;
    }

    .btn-back {
      background: #64748b;
      color: white;
    }

    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

  </style>

</head>


<body>

<div class="container">

  <div class="card">

    <h1>
      🏫 Pengaturan Sekolah
    </h1>

    <div class="subtitle">
      Data ini digunakan otomatis pada laporan sekolah.
    </div>


    <div class="form-group">

      <label>
        Nama Sekolah
      </label>

      <input
        id="namaSekolah"
        type="text"
      >

    </div>


    <div class="form-group">

      <label>
        Nama Kepala Sekolah
      </label>

      <input
        id="namaKepala"
        type="text"
      >

    </div>


    <div class="form-group">

      <label>
        NIP Kepala Sekolah
      </label>

      <input
        id="nipKepala"
        type="text"
        inputmode="numeric"
      >

    </div>


    <div
      id="message"
      class="message"
    ></div>


    <div class="buttons">

      <button
        class="btn-save"
        onclick="simpanSekolah()"
      >
        💾 Simpan
      </button>


      <button
        class="btn-back"
        onclick="location.href='admin.html'"
      >
        ← Kembali
      </button>

    </div>

  </div>

</div>


<script src="sekolah.js"></script>

</body>

</html>
