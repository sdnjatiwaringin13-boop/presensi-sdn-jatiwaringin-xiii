<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Scan QR Presensi</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* ==================================================
           HALAMAN SCAN
        ================================================== */

        .scan-wrapper {
            width: 100%;
        }


        /* ==================================================
           INFORMASI GURU
        ================================================== */

        .scan-user-box {

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 12px 15px;

            margin-bottom: 15px;

            background: #f7fafc;

            border: 1px solid #e2e8ee;

            border-radius: 7px;

        }


        .scan-user-icon {

            width: 40px;

            height: 40px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: #3b94bd;

            color: #fff;

        }


        .scan-user-name {

            font-size: 13px;

            font-weight: 800;

            color: #25313a;

        }


        .scan-user-role {

            margin-top: 2px;

            font-size: 10px;

            color: #7d8991;

        }


        /* ==================================================
           LAYOUT
        ================================================== */

        .scan-grid {

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                330px;

            gap: 15px;

            align-items: start;

        }


        /* ==================================================
           KAMERA
        ================================================== */

        .scanner-card {

            width: 100%;

            background: #111;

            border-radius: 8px;

            padding: 10px;

            box-sizing: border-box;

        }


        #reader {

            width: 100%;

            min-height: 360px;

            background: #111;

            border-radius: 6px;

            overflow: hidden;

            position: relative;

        }


        #reader video {

            display: block !important;

            width: 100% !important;

            max-width: 100% !important;

            height: auto !important;

            min-height: 300px;

            object-fit: cover;

            border-radius: 6px;

        }


        #reader canvas {

            max-width: 100% !important;

        }


        #reader__dashboard {

            color: #fff !important;

            padding: 8px !important;

        }


        #reader__dashboard_section_csr {

            display: flex !important;

            justify-content: center !important;

            gap: 6px !important;

            flex-wrap: wrap !important;

        }


        #reader__dashboard_section_csr button {

            border: 0 !important;

            border-radius: 5px !important;

            padding: 7px 12px !important;

            background: #3b94bd !important;

            color: #fff !important;

            cursor: pointer !important;

        }


        #reader__scan_region {

            border: 0 !important;

        }


        /* ==================================================
           STATUS
        ================================================== */

        .scan-status {

            margin-top: 10px;

            padding: 10px 12px;

            border-radius: 6px;

            background: #e8f2ff;

            color: #2563a6;

            font-size: 11px;

            font-weight: 600;

        }


        .scan-status.success {

            background: #e9f8ef;

            color: #18743b;

        }


        .scan-status.error {

            background: #fdecec;

            color: #b42318;

        }


        .scan-status.warning {

            background: #fff7df;

            color: #8a6500;

        }


        /* ==================================================
           TOMBOL
        ================================================== */

        .scan-buttons {

            display: flex;

            gap: 7px;

            margin-top: 10px;

        }


        .scan-buttons button {

            border: 0;

            border-radius: 5px;

            padding: 9px 13px;

            cursor: pointer;

            font-family: inherit;

            font-size: 11px;

            font-weight: 700;

        }


        #startScanButton {

            background: #3b94bd;

            color: #fff;

        }


        #stopScanButton {

            background: #edf1f4;

            color: #56636c;

        }


        /* ==================================================
           HASIL
        ================================================== */

        .result-card {

            min-height: 390px;

            background: #fff;

            border: 1px solid #e1e6ea;

            border-radius: 8px;

            overflow: hidden;

        }


        .result-header {

            padding: 12px 14px;

            border-bottom: 1px solid #e7eaed;

            font-size: 12px;

            font-weight: 800;

            color: #27343c;

        }


        .result-body {

            padding: 15px;

        }


        .result-empty {

            min-height: 300px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            color: #9ba5ac;

            font-size: 11px;

        }


        .result-empty i {

            font-size: 42px;

            margin-bottom: 12px;

            color: #d2d8dc;

        }


        .student-success {

            border: 1px solid #d8eee0;

            border-radius: 7px;

            overflow: hidden;

        }


        .student-success-head {

            background: #e9f8ef;

            padding: 13px;

        }


        .student-success-status {

            font-size: 10px;

            color: #218648;

            font-weight: 800;

            text-transform: uppercase;

        }


        .student-success-name {

            margin-top: 4px;

            font-size: 16px;

            font-weight: 800;

            color: #1e2d25;

        }


        .student-info {

            padding: 12px;

        }


        .info-row {

            display: grid;

            grid-template-columns: 75px 12px 1fr;

            gap: 3px;

            padding: 6px 0;

            border-bottom: 1px solid #f0f2f3;

            font-size: 11px;

        }


        .info-row:last-child {

            border-bottom: 0;

        }


        .info-label {

            font-weight: 700;

            color: #69767e;

        }


        .info-value {

            font-weight: 600;

            color: #27343c;

        }


        /* ==================================================
           RESPONSIVE
        ================================================== */

        @media (max-width: 800px) {

            .scan-grid {

                grid-template-columns: 1fr;

            }

            #reader {

                min-height: 300px;

            }

        }

    </style>

</head>


<body>

    <div class="card scan-wrapper">

        <!-- HEADER -->

        <div class="card-header">

            <div class="card-title">

                <i class="fa-solid fa-qrcode"></i>

                Scan QR Presensi

            </div>

        </div>


        <!-- BODY -->

        <div class="card-body">


            <!-- USER -->

            <div class="scan-user-box">

                <div class="scan-user-icon">

                    <i class="fa-solid fa-user"></i>

                </div>


                <div>

                    <div
                        id="guruNama"
                        class="scan-user-name"
                    >
                        Memuat...
                    </div>


                    <div
                        id="guruRole"
                        class="scan-user-role"
                    >
                        -
                    </div>

                </div>

            </div>


            <!-- GRID -->

            <div class="scan-grid">


                <!-- =================================================
                     KAMERA
                ================================================== -->

                <div>


                    <div class="scanner-card">

                        <div id="reader"></div>

                    </div>


                    <div
                        id="scanStatus"
                        class="scan-status"
                    >
                        Menyiapkan kamera...
                    </div>


                    <div class="scan-buttons">

                        <button
                            type="button"
                            id="startScanButton"
                        >

                            <i
                                class="fa-solid fa-camera"
                            ></i>

                            Mulai Kamera

                        </button>


                        <button
                            type="button"
                            id="stopScanButton"
                        >

                            <i
                                class="fa-solid fa-stop"
                            ></i>

                            Stop

                        </button>

                    </div>

                </div>


                <!-- =================================================
                     HASIL
                ================================================== -->

                <div class="result-card">


                    <div class="result-header">

                        <i
                            class="fa-solid fa-user-check"
                        ></i>

                        Hasil Presensi

                    </div>


                    <div
                        id="result"
                        class="result-body"
                    >

                        <div class="result-empty">

                            <i
                                class="fa-solid fa-qrcode"
                            ></i>

                            <div>

                                Arahkan QR kartu siswa
                                ke kamera.

                            </div>

                        </div>

                    </div>

                </div>


            </div>

        </div>

    </div>


    <!-- ==================================================
         QR SCANNER LIBRARY
    ================================================== -->

    <script
        src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
    ></script>


    <!-- API -->

    <script src="api.js"></script>


    <!-- AUTH -->

    <script src="auth.js"></script>


    <!-- LAYOUT -->

    <script src="layout.js"></script>


    <!-- SCAN -->

    <script src="scan.js"></script>


    <!-- PWA -->

    <script src="pwa.js"></script>

</body>

</html>
