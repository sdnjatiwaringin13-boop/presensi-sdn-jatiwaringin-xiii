<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scan QR Presensi</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="style.css">

  <style>

    .scan-page {
      width: 100%;
    }

    .scan-user {
      display: flex;
      align-items: center;
      gap: 12px;

      padding: 12px 15px;
      margin-bottom: 15px;

      background: #f7fafc;
      border: 1px solid #e2e8ee;
      border-radius: 8px;
    }

    .scan-user-icon {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #3b94bd;
      color: #fff;
    }

    .scan-user-name {
      font-weight: 800;
      font-size: 14px;
    }

    .scan-user-role {
      margin-top: 3px;
      font-size: 11px;
      color: #7d8991;
    }

    .scan-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 15px;
      align-items: start;
    }

    .camera-box {
      position: relative;

      width: 100%;
      max-width: 700px;

      margin: auto;

      overflow: hidden;

      background: #111;

      border-radius: 10px;
    }

    #video {
      display: block;

      width: 100%;
      min-height: 380px;

      object-fit: cover;

      background: #111;
    }

    .scanner-frame {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 260px;
      height: 260px;

      transform: translate(-50%, -50%);

      border: 3px solid #fff;
      border-radius: 12px;

      box-shadow:
        0 0 0 9999px rgba(0,0,0,.25);

      pointer-events: none;
    }

    .scanner-frame::before,
    .scanner-frame::after {
      content: "";

      position: absolute;

      width: 45px;
      height: 45px;

      border-color: #22c55e;
    }

    .scanner-frame::before {
      top: -4px;
      left: -4px;

      border-top: 6px solid #22c55e;
      border-left: 6px solid #22c55e;

      border-radius: 10px 0 0 0;
    }

    .scanner-frame::after {
      right: -4px;
      bottom: -4px;

      border-right: 6px solid #22c55e;
      border-bottom: 6px solid #22c55e;

      border-radius: 0 0 10px 0;
    }

    #scanCanvas {
      display: none;
    }

    .scan-status {
      margin-top: 10px;

      padding: 11px 13px;

      border-radius: 6px;

      background: #e8f2ff;
      color: #2363a1;

      font-size: 12px;
      font-weight: 600;
    }

    .scan-status.success {
      background: #e8f8ee;
      color: #17713a;
    }

    .scan-status.error {
      background: #fdecec;
      color: #b42318;
    }

    .scan-status.warning {
      background: #fff4d8;
      color: #8a6200;
    }

    .scan-buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .scan-buttons button {
      height: 38px;
      padding: 0 14px;

      border: 0;
      border-radius: 6px;

      cursor: pointer;

      font-size: 12px;
      font-weight: 700;
    }

    #startCamera {
      background: #3b94bd;
      color: #fff;
    }

    #stopCamera {
      background: #edf1f4;
      color: #52616a;
    }

    .result-card {
      min-height: 430px;

      border: 1px solid #e2e7ea;
      border-radius: 8px;

      background: #fff;
      overflow: hidden;
    }

    .result-header {
      padding: 13px;

      border-bottom: 1px solid #e7eaed;

      font-size: 12px;
      font-weight: 800;
    }

    #result {
      padding: 15px;
    }

    .result-empty {
      min-height: 330px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      color: #98a2a8;
    }

    .result-empty i {
      margin-bottom: 12px;

      font-size: 42px;

      color: #ccd3d7;
    }

    .result-success {
      overflow: hidden;

      border: 1px solid #d8eee0;
      border-radius: 8px;
    }

    .result-success-head {
      padding: 15px;

      background: #e8f8ee;
    }

    .result-success-head small {
      color: #24834b;
      font-weight: 800;
    }

    .result-success-head h3 {
      margin: 5px 0 0;

      font-size: 18px;
    }

    .result-data {
      padding: 12px 15px;
    }

    .result-row {
      display: grid;

      grid-template-columns: 80px 12px 1fr;

      padding: 7px 0;

      border-bottom: 1px solid #f1f2f3;

      font-size: 12px;
    }

    .result-row:last-child {
      border-bottom: 0;
    }

    .result-label {
      font-weight: 700;
      color: #65727a;
    }

    @media (max-width: 800px) {

      .scan-grid {
        grid-template-columns: 1fr;
      }

      #video {
        min-height: 300px;
      }

      .scanner-frame {
        width: 220px;
        height: 220px;
      }

    }

  </style>

</head>


<body>

  <div class="card scan-page">


    <div class="card-header">

      <div class="card-title">

        <i class="fa-solid fa-qrcode"></i>

        Scan QR Presensi

      </div>

    </div>


    <div class="card-body">


      <div class="scan-user">

        <div class="scan-user-icon">

          <i class="fa-solid fa-user"></i>

        </div>


        <div>

          <div
            id="guruNama"
            class="scan-user-name"
          >
            Memuat...
          </div>

          <div
            id="guruRole"
            class="scan-user-role"
          >
            -
          </div>

        </div>

      </div>


      <div class="scan-grid">


        <!-- KAMERA -->

        <div>

          <div class="camera-box">

            <video
              id="video"
              autoplay
              muted
              playsinline
            ></video>

            <div class="scanner-frame"></div>

          </div>


          <canvas
            id="scanCanvas"
          ></canvas>


          <div
            id="scanStatus"
            class="scan-status"
          >
            Menyiapkan kamera...
          </div>


          <div class="scan-buttons">

            <button
              id="startCamera"
              type="button"
            >
              <i class="fa-solid fa-camera"></i>
              Mulai Kamera
            </button>


            <button
              id="stopCamera"
              type="button"
            >
              <i class="fa-solid fa-stop"></i>
              Stop
            </button>

          </div>

        </div>


        <!-- HASIL -->

        <div class="result-card">

          <div class="result-header">

            <i class="fa-solid fa-user-check"></i>

            Hasil Presensi

          </div>


          <div id="result">

            <div class="result-empty">

              <i class="fa-solid fa-qrcode"></i>

              Arahkan QR kartu siswa
              ke kamera.

            </div>

          </div>

        </div>


      </div>

    </div>

  </div>


  <!-- QR DECODER -->

  <script
    src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"
  ></script>


  <script src="api.js"></script>

  <script src="auth.js"></script>

  <script src="layout.js"></script>

  <script src="scan.js"></script>

  <script src="pwa.js"></script>

</body>

</html>
