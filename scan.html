<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scan Presensi</title>

  <meta
    name="theme-color"
    content="#1565c0"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<header class="topbar">

  <div class="topbar-left">

    <div class="topbar-logo">
      SD
    </div>

    <div>

      <div class="topbar-title">
        Scan Presensi
      </div>

      <div class="topbar-school">
        SD Negeri Jatiwaringin XIII
      </div>

    </div>

  </div>


  <div class="topbar-right">

    <button
      class="btn btn-secondary btn-small"
      onclick="location.href='dashboard.html'"
    >
      Dashboard
    </button>

    <button
      class="btn btn-danger btn-small"
      onclick="Auth.logout()"
    >
      Keluar
    </button>

  </div>

</header>


<main class="container">

  <div class="page-header">

    <div>

      <h1>Scan QR Presensi</h1>

      <p>
        Arahkan kamera ke QR siswa.
      </p>

    </div>

  </div>


  <section class="card">

    <div class="form-group">

      <label for="scanKelas">
        Kelas
      </label>

      <select id="scanKelas">

        <option value="">
          Pilih kelas
        </option>

      </select>

    </div>


    <div class="qr-scanner-wrapper">

      <div id="reader"></div>

    </div>


    <div class="form-actions">

      <button
        class="btn btn-primary"
        id="btnStartScan"
      >
        Mulai Kamera
      </button>

      <button
        class="btn btn-secondary"
        id="btnStopScan"
      >
        Hentikan Kamera
      </button>

    </div>


    <div
      id="scanResult"
      class="scan-result"
    >
      Kamera belum dimulai.
    </div>


    <div
      id="scanMessage"
      class="message"
      style="display:none;"
    ></div>

  </section>


  <section class="card">

    <div class="card-header">

      <h2>Presensi Terakhir</h2>

    </div>


    <div
      id="lastStudent"
      class="last-student"
    >
      Belum ada siswa yang discan.
    </div>

  </section>

</main>


<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script src="auth.js"></script>
<script src="scan.js"></script>
<script src="pwa.js"></script>

</body>
</html>
