<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan QR Presensi</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
.scan-page{max-width:1100px;margin:auto}
.scan-user{display:flex;align-items:center;gap:12px;padding:12px 15px;margin-bottom:15px;background:#fff;border:1px solid #e2e8ee;border-radius:10px}
.scan-user-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#3b94bd;color:#fff}
.scan-user-name{font-weight:800;font-size:14px}.scan-user-role{font-size:11px;color:#7d8991;margin-top:3px}
.scan-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:15px;align-items:start}
.scan-card,.result-card{background:#fff;border:1px solid #e2e7ea;border-radius:10px;overflow:hidden}
.scan-card-header,.result-header{padding:13px 15px;border-bottom:1px solid #e7eaed;font-size:13px;font-weight:800}
.camera-wrap{padding:15px;background:#f7f9fa}
#reader{width:100%;max-width:650px;margin:auto;background:#111;border-radius:10px;overflow:hidden;min-height:360px}
#reader video{width:100%!important;height:auto!important;display:block}
#reader__scan_region{min-height:320px;display:flex;align-items:center;justify-content:center}
#reader__dashboard{padding:10px!important;background:#fff}
#reader__dashboard_section_csr button{margin:5px!important;padding:9px 14px!important;border:0!important;border-radius:6px!important;background:#3b94bd!important;color:#fff!important;font-weight:700!important;cursor:pointer}
#reader__dashboard_section_swaplink{color:#3b94bd!important}
.scan-status{margin-top:10px;padding:11px 13px;border-radius:7px;background:#e8f2ff;color:#2363a1;font-size:12px;font-weight:600}
.scan-status.success{background:#e8f8ee;color:#17713a}.scan-status.error{background:#fdecec;color:#b42318}.scan-status.warning{background:#fff4d8;color:#8a6200}
.scan-actions{display:flex;gap:8px;margin-top:10px}.scan-actions button{height:38px;padding:0 14px;border:0;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700}
#startCamera{background:#3b94bd;color:#fff}#stopCamera{background:#edf1f4;color:#52616a}
#result{padding:15px;min-height:390px}.result-empty{min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#98a2a8}.result-empty i{font-size:42px;color:#ccd3d7;margin-bottom:12px}
.result-success{border:1px solid #d8eee0;border-radius:9px;overflow:hidden}.result-success-head{padding:16px;background:#eaf8ef}.result-success-head small{color:#17713a;font-weight:800}.result-success-head h3{margin:8px 0 0;font-size:19px}.result-data{padding:12px}.result-row{display:grid;grid-template-columns:80px 15px 1fr;gap:4px;padding:8px 0;border-bottom:1px solid #edf0f2;font-size:13px}.result-label{font-weight:700}
@media(max-width:850px){.scan-grid{grid-template-columns:1fr}.result-card{min-height:0}}
</style>
</head>
<body>
<div class="scan-page">
  <div class="scan-user">
    <div class="scan-user-icon"><i class="fa-solid fa-user"></i></div>
    <div><div id="guruNama" class="scan-user-name">Pengguna</div><div id="guruRole" class="scan-user-role">-</div></div>
  </div>

  <div class="scan-grid">
    <div class="scan-card">
      <div class="scan-card-header"><i class="fa-solid fa-qrcode"></i> Scan QR Presensi</div>
      <div class="camera-wrap">
        <div id="reader"></div>
        <div id="scanStatus" class="scan-status">Menyiapkan kamera...</div>
        <div class="scan-actions">
          <button id="startCamera" type="button"><i class="fa-solid fa-camera"></i> Buka Kamera</button>
          <button id="stopCamera" type="button"><i class="fa-solid fa-stop"></i> Stop</button>
        </div>
      </div>
    </div>

    <div class="result-card">
      <div class="result-header"><i class="fa-solid fa-user-check"></i> Hasil Presensi</div>
      <div id="result"><div class="result-empty"><i class="fa-solid fa-qrcode"></i>Arahkan QR kartu siswa<br>ke kamera.</div></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
<script src="layout.js"></script>
<script src="scan.js"></script>
<script src="pwa.js"></script>
</body>
</html>
