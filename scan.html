<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Scan QR Presensi
    </title>


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- STYLE DASHBOARD -->

    <link
        rel="stylesheet"
        href="style.css"
    >


    <style>

        /* =====================================================
           SCAN PAGE
        ===================================================== */

        .scan-page {
            width: 100%;
        }


        /* =====================================================
           INFO GURU
        ===================================================== */

        .scan-guru {

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 14px 16px;

            margin-bottom: 18px;

            background: #f7fafc;

            border: 1px solid #e5eaee;

            border-radius: 8px;
        }


        .scan-guru-icon {

            width: 42px;
            height: 42px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #3b94bd;

            color: white;

            flex-shrink: 0;
        }


        .scan-guru-name {

            font-size: 14px;

            font-weight: 800;

            color: #25313a;
        }


        .scan-guru-role {

            margin-top: 3px;

            font-size: 11px;

            color: #7b8790;
        }


        /* =====================================================
           SCANNER
        ===================================================== */

        .scanner-layout {

            display: grid;

            grid-template-columns:
                minmax(300px, 1fr)
                minmax(280px, 380px);

            gap: 20px;

            align-items: start;
        }


        .scanner-box {

            background: #111;

            border-radius: 10px;

            padding: 12px;

            min-height: 340px;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;
        }


        #reader {

            width: 100%;

            max-width: 520px;

            overflow: hidden;

            border-radius: 8px;
        }


        #reader video {

            width: 100% !important;

            height: auto !important;

            border-radius: 8px;
        }


        /* Hilangkan tampilan default html5-qrcode
           yang terlalu ramai */

        #reader img[alt="Info icon"] {
            display: none !important;
        }


        #reader__dashboard_section_csr button {

            padding: 8px 12px !important;

            border: 0 !important;

            border-radius: 6px !important;

            background: #3b94bd !important;

            color: #fff !important;

            cursor: pointer;
        }


        /* =====================================================
           PANEL HASIL
        ===================================================== */

        .scan-result-panel {

            min-height: 340px;

            border: 1px solid #e5eaee;

            border-radius: 10px;

            background: #fff;

            padding: 20px;
        }


        .scan-result-title {

            font-size: 14px;

            font-weight: 800;

            margin-bottom: 15px;

            color: #26333b;
        }


        .scan-empty {

            min-height: 260px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            color: #9aa4aa;
        }


        .scan-empty i {

            font-size: 42px;

            margin-bottom: 12px;

            color: #cbd2d6;
        }


        /* =====================================================
           DATA SISWA
        ===================================================== */

        .student-result {

            border: 1px solid #e5eaee;

            border-radius: 8px;

            overflow: hidden;
        }


        .student-result-header {

            padding: 14px;

            background: #3b94bd;

            color: #fff;
        }


        .student-result-header .status {

            font-size: 10px;

            text-transform: uppercase;

            font-weight: 700;

            opacity: .85;
        }


        .student-result-header .name {

            margin-top: 4px;

            font-size: 17px;

            font-weight: 800;
        }


        .student-result-body {

            padding: 14px;
        }


        .result-row {

            display: grid;

            grid-template-columns:
                90px 15px 1fr;

            gap: 4px;

            padding: 6px 0;

            border-bottom: 1px solid #f0f2f3;

            font-size: 12px;
        }


        .result-row:last-child {

            border-bottom: 0;
        }


        .result-label {

            font-weight: 700;

            color: #65727a;
        }


        .result-colon {

            text-align: center;
        }


        .result-value {

            font-weight: 600;

            color: #202a30;
        }


        /* =====================================================
           STATUS
        ===================================================== */

        #scanStatus {

            margin-top: 15px;

            border-radius: 7px;

            padding: 11px 14px;

            font-size: 12px;

            font-weight: 600;
        }


        /* =====================================================
           BUTTON
        ===================================================== */

        .scan-actions {

            display: flex;

            gap: 8px;

            margin-top: 15px;
        }


        .scan-actions button {

            height: 38px;

            padding: 0 14px;

            border: 0;

            border-radius: 6px;

            cursor: pointer;

            font-family: inherit;

            font-size: 12px;

            font-weight: 700;
        }


        #startScanButton {

            background: #3b94bd;

            color: #fff;
        }


        #stopScanButton {

            background: #eef2f4;

            color: #53616a;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media screen and (max-width: 800px) {

            .scanner-layout {

                grid-template-columns: 1fr;

            }

        }


        /* =====================================================
           PRINT
        ===================================================== */

        @media print {

            .scan-page {

                box-shadow: none !important;

                border: 0 !important;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         CARD DASHBOARD
    ===================================================== -->

    <div class="card scan-page">


        <!-- HEADER -->

        <div class="card-header">

            <div class="card-title">

                <i class="fa-solid fa-qrcode"></i>

                Scan QR Presensi

            </div>

        </div>


        <!-- BODY -->

        <div class="card-body">


            <!-- =================================================
                 INFO GURU
            ================================================= -->

            <div
                id="guruInfo"
                class="scan-guru"
            >

                <div class="scan-guru-icon">

                    <i class="fa-solid fa-user-tie"></i>

                </div>


                <div>

                    <div
                        id="guruNama"
                        class="scan-guru-name"
                    >
                        Memuat pengguna...
                    </div>


                    <div
                        id="guruRole"
                        class="scan-guru-role"
                    >
                        -
                    </div>

                </div>

            </div>


            <!-- =================================================
                 SCANNER + HASIL
            ================================================= -->

            <div class="scanner-layout">


                <!-- CAMERA -->

                <div>


                    <div class="scanner-box">

                        <div id="reader"></div>

                    </div>


                    <div
                        id="scanStatus"
                        class="alert alert-info"
                    >

                        Menyiapkan kamera...

                    </div>


                    <div class="scan-actions">

                        <button
                            type="button"
                            id="startScanButton"
                        >

                            <i
                                class="fa-solid fa-camera"
                            ></i>

                            Mulai Kamera

                        </button>


                        <button
                            type="button"
                            id="stopScanButton"
                        >

                            <i
                                class="fa-solid fa-stop"
                            ></i>

                            Stop

                        </button>

                    </div>


                </div>


                <!-- HASIL -->

                <div
                    class="scan-result-panel"
                >

                    <div
                        class="scan-result-title"
                    >

                        <i
                            class="fa-solid fa-user-check"
                        ></i>

                        Hasil Presensi

                    </div>


                    <div
                        id="result"
                        class="scan-empty"
                    >

                        <i
                            class="fa-solid fa-qrcode"
                        ></i>

                        <div>
                            Arahkan QR kartu siswa
                            ke kamera.
                        </div>

                    </div>

                </div>


            </div>


        </div>

    </div>


    <!-- =====================================================
         LIBRARY QR
    ===================================================== -->

    <script
        src="https://unpkg.com/html5-qrcode"
    ></script>


    <!-- API -->

    <script src="api.js"></script>


    <!-- AUTH -->

    <script src="auth.js"></script>


    <!-- LAYOUT -->

    <script src="layout.js"></script>


    <!-- SCAN -->

    <script src="scan.js"></script>


    <!-- PWA -->

    <script src="pwa.js"></script>


</body>

</html>
