<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Absensi Bulanan</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 20px;
    }

    .panel {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .form-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    select,
    input,
    button {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      cursor: pointer;
      background: #2563eb;
      color: white;
      border: none;
    }

    .btn-print {
      background: #059669;
    }

    .btn-back {
      background: #6b7280;
    }

    #loading {
      display: none;
      padding: 20px;
      text-align: center;
    }

    #report {
      background: white;
      padding: 25px;
      overflow-x: auto;
    }

    .kop {
      text-align: center;
      margin-bottom: 20px;
    }

    .kop h1 {
      font-size: 22px;
      margin: 0;
    }

    .kop h2 {
      font-size: 18px;
      margin: 5px 0 20px;
    }

    .info {
      margin-bottom: 20px;
      line-height: 1.8;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 11px;
    }

    th,
    td {
      border: 1px solid #000;
      padding: 4px;
      text-align: center;
      white-space: nowrap;
    }

    th.nama,
    td.nama {
      min-width: 180px;
      text-align: left;
    }

    th.no,
    td.no {
      width: 35px;
    }

    .keterangan {
      margin-top: 15px;
      font-size: 12px;
    }

    .ttd {
      display: flex;
      justify-content: space-between;
      margin-top: 60px;
      text-align: center;
    }

    .ttd-box {
      width: 250px;
    }

    .ttd-space {
      height: 70px;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    @media print {

      body {
        background: white;
      }

      .no-print {
        display: none !important;
      }

      .container {
        max-width: none;
        padding: 0;
      }

      .panel {
        display: none;
      }

      #report {
        padding: 0;
      }

      @page {
        size: landscape;
        margin: 8mm;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <div class="panel no-print">

    <h2>📋 Absensi Bulanan</h2>

    <div class="form-row">

  <div class="form-group">
    <label>Bulan</label>

    <select id="bulan">
      <option value="1">Januari</option>
      <option value="2">Februari</option>
      <option value="3">Maret</option>
      <option value="4">April</option>
      <option value="5">Mei</option>
      <option value="6">Juni</option>
      <option value="7">Juli</option>
      <option value="8">Agustus</option>
      <option value="9">September</option>
      <option value="10">Oktober</option>
      <option value="11">November</option>
      <option value="12">Desember</option>
    </select>
  </div>


  <div class="form-group">
    <label>Tahun</label>

    <input
      type="number"
      id="tahun"
      value="2026"
      min="2020"
      max="2100"
    >
  </div>


  <button
    type="button"
    onclick="buatLaporan()"
  >
    🔍 Tampilkan
  </button>


  <button
    type="button"
    class="btn-print"
    onclick="window.print()"
  >
    🖨️ Cetak
  </button>


  <button
    type="button"
    class="btn-excel"
    onclick="downloadExcel()"
  >
    📊 Download Excel
  </button>


  <button
    type="button"
    class="btn-back"
    onclick="history.back()"
  >
    ← Kembali
  </button>

</div>

    <div
      id="message"
      class="message"
    ></div>

  </div>


  <div id="loading">
    ⏳ Membuat laporan...
  </div>


  <div id="report">

    <div class="kop">

      <h1>
        DAFTAR ABSENSI SISWA
      </h1>

      <h2 id="namaSekolah">
        SD NEGERI JATIWARINGIN XIII
      </h2>

    </div>


    <div class="info">

      <div>
        <strong>Kelas</strong>
        &nbsp;&nbsp;&nbsp;:
        <span id="kelas">-</span>
      </div>

      <div>
        <strong>Wali Kelas</strong>
        :
        <span id="waliKelas">-</span>
      </div>

      <div>
        <strong>Bulan</strong>
        &nbsp;&nbsp;&nbsp;:
        <span id="periode">-</span>
      </div>

    </div>


    <table>

      <thead id="tableHead"></thead>

      <tbody id="tableBody"></tbody>

    </table>


    <div class="keterangan">

      <strong>Keterangan:</strong>

      H = Hadir &nbsp;&nbsp;

      I = Izin &nbsp;&nbsp;

      S = Sakit &nbsp;&nbsp;

      A = Alpa

    </div>


    <div class="ttd">

      <div class="ttd-box">

        Kepala Sekolah

        <div class="ttd-space"></div>

        <strong id="namaKepala">
          -
        </strong>

        <br>

        NIP.
        <span id="nipKepala">
          -
        </span>

      </div>


      <div class="ttd-box">

        Wali Kelas

        <div class="ttd-space"></div>

        <strong id="namaWali">
          -
        </strong>

        <br>

        NIP.
        <span id="nipWali">
          -
        </span>

      </div>

    </div>

  </div>

</div>



<script src="absen-bulanan.js"></script>

  
<script src="absen-bulanan.js"></script>

</body>

</html>
