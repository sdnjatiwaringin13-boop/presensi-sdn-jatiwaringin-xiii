<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Daftar Absensi Siswa
</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111;
}

.container {
  max-width: 1600px;
  margin: auto;
}

.toolbar {
  background: white;
  padding: 18px;
  border-radius: 12px;
  margin-bottom: 15px;
}

.toolbar-row {
  display: flex;
  gap: 12px;
  align-items: end;
  flex-wrap: wrap;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

select,
button {
  padding: 10px 14px;
  border-radius: 7px;
  border: 1px solid #ccc;
}

button {
  cursor: pointer;
  border: none;
  font-weight: bold;
}

.blue {
  background: #2563eb;
  color: white;
}

.green {
  background: #16a34a;
  color: white;
}

.gray {
  background: #64748b;
  color: white;
}


/* HEADER */

.report {
  background: white;
  padding: 25px;
}

.report-title {
  text-align: center;
}

.report-title h1 {
  margin: 0;
  font-family: "Times New Roman", serif;
  font-size: 31px;
}

.report-title h2 {
  margin: 5px 0 15px;
  font-family: "Times New Roman", serif;
  font-size: 24px;
}

.line {
  border-top: 3px solid black;
  margin-bottom: 18px;
}

.identity {
  font-size: 15px;
  margin-bottom: 20px;
}

.identity-row {
  display: grid;
  grid-template-columns:
    120px
    15px
    auto;

  margin-bottom: 5px;
}

.identity-label {
  font-weight: bold;
}


/* TABLE */

.table-wrapper {
  overflow-x: auto;
}

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 1150px;
  table-layout: fixed;
}

th,
td {
  border: 1px solid #222;
  padding: 5px 2px;
  text-align: center;
  font-size: 11px;
}

th {
  background: #e5e7eb;
}

.no {
  width: 40px;
}

.nama {
  width: 190px;
  text-align: left;
  padding-left: 8px;
}

.hari {
  width: 27px;
}

.total {
  width: 32px;
}

.hadir {
  color: #059669;
  font-weight: bold;
}

.izin {
  color: #f59e0b;
  font-weight: bold;
}

.sakit {
  color: #7c3aed;
  font-weight: bold;
}

.alpa {
  color: #dc2626;
  font-weight: bold;
}


/* KETERANGAN */

.legend {
  margin-top: 20px;
  border: 1px solid #94a3b8;
  border-radius: 7px;
  padding: 12px 18px;
  display: inline-block;
}

.legend strong {
  margin-right: 15px;
}

.legend span {
  margin-right: 22px;
}


/* SIGNATURE */

.signature-area {
  margin-top: 45px;
  display: flex;
  justify-content: space-between;
  gap: 100px;
  padding: 0 50px;
}

.signature {
  width: 310px;
  font-size: 14px;
}

.signature.left {
  text-align: left;
}

.signature.right {
  text-align: left;
}

.sign-space {
  height: 75px;
}

.name-signature {
  font-weight: bold;
  text-decoration: underline;
}

.loading {
  padding: 30px;
  text-align: center;
}

.error {
  display: none;
  padding: 12px;
  background: #fee2e2;
  color: #991b1b;
}


/* PRINT */

@media print {

  @page {
    size: A4 landscape;
    margin: 8mm;
  }

  body {
    margin: 0;
    padding: 0;
    background: white;
  }

  .no-print {
    display: none !important;
  }

  .report {
    padding: 0;
  }

  .report-title h1 {
    font-size: 25px;
  }

  .report-title h2 {
    font-size: 20px;
  }

  table {
    min-width: 0;
    width: 100%;
  }

  th,
  td {
    font-size: 8px;
    padding: 2px 1px;
  }

  .nama {
    width: 130px;
  }

  .hari {
    width: auto;
  }

  .signature-area {
    margin-top: 25px;
  }

  .sign-space {
    height: 55px;
  }

}

</style>

</head>


<body>


<div class="container">


<!-- FILTER -->

<div class="toolbar no-print">

  <div class="toolbar-row">


    <div class="form-group">

      <label>
        Bulan
      </label>

      <select id="bulan">

        <option value="1">Januari</option>
        <option value="2">Februari</option>
        <option value="3">Maret</option>
        <option value="4">April</option>
        <option value="5">Mei</option>
        <option value="6">Juni</option>
        <option value="7">Juli</option>
        <option value="8">Agustus</option>
        <option value="9">September</option>
        <option value="10">Oktober</option>
        <option value="11">November</option>
        <option value="12">Desember</option>

      </select>

    </div>


    <div class="form-group">

      <label>
        Tahun
      </label>

      <select id="tahun"></select>

    </div>


    <button
      class="blue"
      onclick="tampilkanAbsen()"
    >
      🔍 Tampilkan
    </button>


    <button
      class="green"
      onclick="window.print()"
    >
      🖨️ Cetak
    </button>


    <button
      class="gray"
      onclick="location.href='presensi.html'"
    >
      ← Kembali
    </button>


  </div>

</div>


<!-- REPORT -->

<div class="report">


  <div class="report-title">

    <h1>
      DAFTAR ABSENSI SISWA
    </h1>

    <h2 id="namaSekolah">
      SD NEGERI JATIWARINGIN XIII
    </h2>

  </div>


  <div class="line"></div>


  <div class="identity">

    <div class="identity-row">

      <div class="identity-label">
        Kelas
      </div>

      <div>:</div>

      <div id="kelasGuru">
        -
      </div>

    </div>


    <div class="identity-row">

      <div class="identity-label">
        Wali Kelas
      </div>

      <div>:</div>

      <div id="namaGuru">
        -
      </div>

    </div>


    <div class="identity-row">

      <div class="identity-label">
        Bulan
      </div>

      <div>:</div>

      <div id="periode">
        -
      </div>

    </div>

  </div>


  <div
    id="loading"
    class="loading"
  >
    Memuat data...
  </div>


  <div
    id="error"
    class="error"
  ></div>


  <div
    id="hasil"
    style="display:none;"
  >


    <div class="table-wrapper">

      <table>

        <thead id="tableHead"></thead>

        <tbody id="tableBody"></tbody>

      </table>

    </div>


    <div class="legend">

      <strong>
        Keterangan:
      </strong>

      <span>
        <b class="hadir">H</b>
        = Hadir
      </span>

      <span>
        <b class="izin">I</b>
        = Izin
      </span>

      <span>
        <b class="sakit">S</b>
        = Sakit
      </span>

      <span>
        <b class="alpa">A</b>
        = Alpa
      </span>

    </div>


    <!-- TANDA TANGAN -->

    <div class="signature-area">


      <div class="signature left">

        <div>
          Mengetahui,
        </div>

        <div>
          Kepala Sekolah
        </div>

        <div class="sign-space"></div>

        <div
          class="name-signature"
          id="namaKepala"
        >
          __________________
        </div>

        <div>
          NIP.
          <span id="nipKepala">
            __________________
          </span>
        </div>

      </div>


      <div class="signature right">

        <div id="tanggalCetak">
          Jakarta, -
        </div>

        <div>
          Wali Kelas
          <span id="kelasTtd">
          </span>
        </div>

        <div class="sign-space"></div>

        <div
          class="name-signature"
          id="namaGuruTtd"
        >
          __________________
        </div>

        <div>
          NIP.
          <span id="nipGuru">
            __________________
          </span>
        </div>

      </div>


    </div>


  </div>


</div>


</div>


<script src="absen-bulanan.js"></script>

</body>

</html>
