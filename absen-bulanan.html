<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Laporan Kehadiran Siswa
  </title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    .report-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      align-items: end;
    }

    .report-toolbar .form-group {
      min-width: 150px;
    }

    .laporan-bulanan {
      overflow-x: auto;
    }

    .table-report {
      border-collapse: collapse;
      width: 100%;
      min-width: 1200px;
      font-size: 10px;
    }

    .table-report th,
    .table-report td {
      border: 1px solid #222;
      padding: 3px;
      text-align: center;
    }

    .table-report .nama-siswa {
      text-align: left;
      min-width: 160px;
    }

    .report-header {
      text-align: center;
      margin-bottom: 15px;
    }

    .report-header h2 {
      margin-bottom: 15px;
    }

    .report-info {
      text-align: left;
      max-width: 500px;
      margin-bottom: 10px;
    }

    .report-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 35px;
      text-align: center;
    }

    @media print {

      @page {
        size: 330mm 215mm landscape;
        margin: 8mm;
      }

      .app-sidebar,
      .app-topbar,
      .report-toolbar,
      .card-header {
        display: none !important;
      }

      .app-main {
        margin: 0 !important;
      }

      .app-page-content {
        padding: 0 !important;
      }

      .card {
        border: none !important;
        box-shadow: none !important;
      }

      .table-report {
        font-size: 7px;
      }

    }

  </style>
</head>

<body>

  <div class="card">

    <div class="card-header">

      <div class="card-title">
        <i class="fa-solid fa-calendar-days"></i>
        Laporan Bulanan
      </div>

    </div>

    <div class="card-body">

      <div class="report-toolbar">

        <div
          class="form-group"
          id="guruWrapper"
        >

          <label>
            Guru / Wali Kelas
          </label>

          <select id="guruSelect">

            <option value="">
              Pilih Guru
            </option>

          </select>

        </div>

        <div class="form-group">

          <label>
            Bulan
          </label>

          <select id="bulan">

            <option value="1">
              Januari
            </option>

            <option value="2">
              Februari
            </option>

            <option value="3">
              Maret
            </option>

            <option value="4">
              April
            </option>

            <option value="5">
              Mei
            </option>

            <option value="6">
              Juni
            </option>

            <option value="7">
              Juli
            </option>

            <option value="8">
              Agustus
            </option>

            <option value="9">
              September
            </option>

            <option value="10">
              Oktober
            </option>

            <option value="11">
              November
            </option>

            <option value="12">
              Desember
            </option>

          </select>

        </div>

        <div class="form-group">

          <label>
            Tahun
          </label>

          <input
            type="number"
            id="tahun"
            min="2020"
            max="2100"
          >

        </div>

        <button
          type="button"
          id="tampilButton"
          class="btn btn-primary"
        >
          <i class="fa-solid fa-search"></i>
          Tampilkan
        </button>

        <button
          type="button"
          id="printButton"
          class="btn btn-secondary"
        >
          <i class="fa-solid fa-print"></i>
          Cetak
        </button>

        <button
          type="button"
          id="exportExcelButton"
          class="btn btn-success"
        >
          <i class="fa-solid fa-file-excel"></i>
          Excel
        </button>

      </div>

      <div id="reportContent">

        <div class="empty">
          Pilih periode kemudian klik
          <strong>Tampilkan</strong>.
        </div>

      </div>

    </div>

  </div>

  <script
    src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
  ></script>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="layout.js"></script>
  <script src="absen-bulanan.js"></script>
  <script src="pwa.js"></script>

</body>
</html>
