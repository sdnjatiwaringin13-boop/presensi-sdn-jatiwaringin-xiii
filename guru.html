<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Data Guru - Presensi SDN Jatiwaringin XIII
  </title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <div class="card">

    <div class="card-header">

      <div class="card-title">
        <i class="fa-solid fa-chalkboard-user"></i>
        Data Guru
      </div>

      <button
        type="button"
        id="tambahButton"
        class="btn btn-primary"
      >
        <i class="fa-solid fa-plus"></i>
        Tambah Guru
      </button>

    </div>

    <div class="card-body">

      <div
        id="guruMessage"
        style="display:none;"
      ></div>

      <div class="toolbar">

        <input
          type="text"
          id="searchInput"
          placeholder="Cari guru..."
        >

        <select id="statusFilter">
          <option value="">
            Semua Status
          </option>

          <option value="AKTIF">
            Aktif
          </option>

          <option value="NONAKTIF">
            Nonaktif
          </option>
        </select>

        <button
          type="button"
          id="refreshButton"
          class="btn btn-secondary"
        >
          Refresh
        </button>

      </div>

      <div
        id="formGuru"
        style="
          display:none;
          margin-bottom:20px;
        "
      >

        <h3 id="formTitle">
          Tambah Guru
        </h3>

        <form id="guruForm">

          <div class="form-grid">

            <div class="form-group">
              <label>ID Guru</label>

              <input
                type="text"
                id="inputIDGuru"
                required
              >
            </div>

            <div class="form-group">
              <label>NIP</label>

              <input
                type="text"
                id="inputNIP"
              >
            </div>

            <div class="form-group">
              <label>Nama Guru</label>

              <input
                type="text"
                id="inputNama"
                required
              >
            </div>

            <div class="form-group">
              <label>Email</label>

              <input
                type="email"
                id="inputEmail"
              >
            </div>

            <div class="form-group">
              <label>Status</label>

              <select id="inputStatus">
                <option value="AKTIF">
                  AKTIF
                </option>

                <option value="NONAKTIF">
                  NONAKTIF
                </option>
              </select>
            </div>

          </div>

          <button
            type="submit"
            class="btn btn-primary"
          >
            Simpan
          </button>

          <button
            type="button"
            id="cancelButton"
            class="btn btn-secondary"
          >
            Batal
          </button>

        </form>

      </div>

      <p>
        Total Guru:
        <strong id="jumlahGuru">
          0
        </strong>
      </p>

      <div class="table-wrapper">

        <table>

          <thead>
            <tr>
              <th>No</th>
              <th>ID Guru</th>
              <th>NIP</th>
              <th>Nama</th>
              <th>Email</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>

          <tbody id="guruTable"></tbody>

        </table>

      </div>

    </div>

  </div>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="layout.js"></script>
  <script src="guru.js"></script>
  <script src="pwa.js"></script>

</body>
</html>
