<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Data Guru</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="style.css"></head><body><div class="card"><div class="card-header"><div class="card-title"><i class="fa-solid fa-chalkboard-user"></i> Data Guru</div><button id="tambahButton" class="btn btn-primary" type="button">Tambah Guru</button></div><div class="card-body"><div class="toolbar"><input id="searchInput" placeholder="Cari guru..."><select id="statusFilter"><option value="">Semua Status</option><option value="AKTIF">AKTIF</option><option value="NONAKTIF">NONAKTIF</option></select><button id="refreshButton" class="btn btn-secondary" type="button">Refresh</button></div><div id="formGuru" style="display:none"><h3 id="formTitle">Tambah Guru</h3><form id="guruForm"><div class="form-grid"><div class="form-group"><label>ID Guru</label><input id="inputIDGuru" required></div><div class="form-group"><label>NIP</label><input id="inputNIP"></div><div class="form-group"><label>Nama</label><input id="inputNama" required></div><div class="form-group"><label>Email</label><input id="inputEmail" type="email"></div><div class="form-group"><label>Status</label><select id="inputStatus"><option value="AKTIF">AKTIF</option><option value="NONAKTIF">NONAKTIF</option></select></div></div><button class="btn btn-primary" type="submit">Simpan</button><button id="cancelButton" class="btn btn-secondary" type="button">Batal</button></form></div><p>Total Guru: <strong id="jumlahGuru">0</strong></p><div class="table-responsive"><table><thead><tr><th>No</th><th>ID Guru</th><th>NIP</th><th>Nama</th><th>Email</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="guruTable"><tr><td colspan="7" class="loading">Memuat...</td></tr></tbody></table></div></div></div><script src="api.js"></script><script src="auth.js"></script><script src="layout.js"></script><script src="guru.js"></script><script src="pwa.js"></script></body></html>
