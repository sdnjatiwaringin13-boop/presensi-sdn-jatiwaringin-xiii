<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Data Guru</title>

  <meta
    name="theme-color"
    content="#1565c0"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<header class="topbar">

  <div class="topbar-left">

    <div class="topbar-logo">
      SD
    </div>

    <div>

      <div class="topbar-title">
        Data Guru
      </div>

      <div class="topbar-school">
        SD Negeri Jatiwaringin XIII
      </div>

    </div>

  </div>


  <div class="topbar-right">

    <button
      class="btn btn-secondary btn-small"
      onclick="location.href='dashboard.html'"
    >
      Dashboard
    </button>

    <button
      class="btn btn-danger btn-small"
      onclick="Auth.logout()"
    >
      Keluar
    </button>

  </div>

</header>


<main class="container">

  <div class="page-header">

    <div>

      <h1>Data Guru</h1>

      <p>
        Kelola data guru dan wali kelas.
      </p>

    </div>

  </div>


  <!-- FORM GURU -->

  <section class="card">

    <div class="card-header">

      <h2 id="formTitle">
        Tambah Guru
      </h2>

    </div>


    <form id="guruForm">

      <input
        type="hidden"
        id="guruId"
      >


      <div class="form-grid">

        <div class="form-group">

          <label for="guruNip">
            NIP
          </label>

          <input
            type="text"
            id="guruNip"
          >

        </div>


        <div class="form-group">

          <label for="guruNama">
            Nama Guru
          </label>

          <input
            type="text"
            id="guruNama"
            required
          >

        </div>


        <div class="form-group">

          <label for="guruEmail">
            Email
          </label>

          <input
            type="email"
            id="guruEmail"
          >

        </div>


        <div class="form-group">

          <label for="guruStatus">
            Status
          </label>

          <select id="guruStatus">

            <option value="AKTIF">
              AKTIF
            </option>

            <option value="NONAKTIF">
              NONAKTIF
            </option>

          </select>

        </div>

      </div>


      <div class="form-actions">

        <button
          type="submit"
          class="btn btn-primary"
          id="btnSimpanGuru"
        >
          Simpan
        </button>


        <button
          type="button"
          class="btn btn-secondary"
          id="btnBatalGuru"
          style="display:none;"
        >
          Batal
        </button>

      </div>

    </form>


    <div
      id="guruMessage"
      class="message"
      style="display:none;"
    ></div>

  </section>


  <!-- DATA GURU -->

  <section class="card">

    <div class="card-header">

      <h2>Daftar Guru</h2>

    </div>


    <div class="table-wrapper">

      <table>

        <thead>

          <tr>

            <th>No</th>
            <th>ID Guru</th>
            <th>NIP</th>
            <th>Nama</th>
            <th>Email</th>
            <th>Status</th>
            <th>Aksi</th>

          </tr>

        </thead>


        <tbody id="guruTableBody">

          <tr>

            <td
              colspan="7"
              class="text-center"
            >
              Memuat data...

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>


<script src="auth.js"></script>
<script src="guru.js"></script>
<script src="pwa.js"></script>

</body>
</html>
