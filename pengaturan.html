<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Pengaturan - SDN Jatiwaringin XIII
    </title>


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="card">

        <div class="card-header">

            <div class="card-title">

                <i class="fa-solid fa-gear"></i>

                Pengaturan Sistem

            </div>

        </div>


        <div class="card-body">

            <div
                id="pengaturanMessage"
            ></div>


            <form
                id="pengaturanForm"
            >

                <div class="form-grid">

                    <div class="form-group full">

                        <label>
                            Nama Sekolah
                        </label>

                        <input
                            type="text"
                            id="namaSekolah"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Nama Kepala Sekolah
                        </label>

                        <input
                            type="text"
                            id="namaKepalaSekolah"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            NIP Kepala Sekolah
                        </label>

                        <input
                            type="text"
                            id="nipKepalaSekolah"
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >

                    <i class="fa-solid fa-save"></i>

                    Simpan Pengaturan

                </button>

            </form>

        </div>

    </div>


    <script src="auth.js"></script>
    <script src="layout.js"></script>
    <script src="pengaturan.js"></script>
    <script src="pwa.js"></script>

</body>

</html>
