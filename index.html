<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#2789bd"><title>Login - Presensi SDN Jatiwaringin XIII</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="style.css"></head><body class="login-page"><div class="login-shell"><div class="login-hero"><div class="login-logo"><i class="fa-solid fa-school"></i></div><h1>Presensi Siswa</h1><p>SD Negeri Jatiwaringin XIII</p><div class="login-clock" id="loginClock">--:--:--</div></div><div class="login-body"><div class="login-welcome"><h2>Selamat Datang</h2><p>Silakan masuk untuk mengakses sistem presensi.</p></div><form id="loginForm"><div class="form-group"><label for="username">Username</label><div class="input-icon"><i class="fa-solid fa-user"></i><input id="username" name="username" autocomplete="username" placeholder="Masukkan username" required></div></div><div class="form-group"><label for="password">Password</label><div class="input-icon"><i class="fa-solid fa-lock"></i><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required><button type="button" id="togglePassword" class="password-toggle"><i class="fa-solid fa-eye"></i></button></div></div><button id="btnLogin" type="submit" class="btn btn-primary btn-full"><i class="fa-solid fa-right-to-bracket"></i> Masuk</button></form><div id="loginMessage" class="message" style="display:none"></div><div class="login-footer">Sistem Presensi Sekolah<br>SD Negeri Jatiwaringin XIII</div></div></div><script src="api.js"></script><script src="auth.js"></script><script src="script.js"></script><script src="pwa.js"></script></body></html>
