<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Presensi SD Negeri Jatiwaringin XIII
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <main class="login-container">

    <div class="login-card">

      <div class="school-logo">
        SD
      </div>

      <h1>
        Presensi Siswa
      </h1>

      <p class="school-name">
        SD Negeri Jatiwaringin XIII
      </p>


      <form id="loginForm">

        <div class="form-group">

          <label for="username">
            Username
          </label>

          <input
            type="text"
            id="username"
            placeholder="Masukkan username"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            required
          >

        </div>


        <button
          type="submit"
          id="loginButton"
        >
          LOGIN
        </button>


        <div
          id="message"
          class="message"
        ></div>

      </form>

    </div>

  </main>


  <script src="script.js"></script>

</body>

</html>
