<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Presensi Siswa</title>

  <meta
    name="theme-color"
    content="#1565c0"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<header class="topbar">

  <div class="topbar-left">

    <div class="topbar-logo">
      SD
    </div>

    <div>

      <div class="topbar-title">
        Presensi Siswa
      </div>

      <div class="topbar-school">
        SD Negeri Jatiwaringin XIII
      </div>

    </div>

  </div>


  <div class="topbar-right">

    <button
      class="btn btn-secondary btn-small"
      onclick="location.href='dashboard.html'"
    >
      Dashboard
    </button>

    <button
      class="btn btn-danger btn-small"
      onclick="Auth.logout()"
    >
      Keluar
    </button>

  </div>

</header>


<main class="container">

  <div class="page-header">

    <div>

      <h1>Presensi Siswa</h1>

      <p>
        Input presensi siswa berdasarkan kelas.
      </p>

    </div>

  </div>


  <section class="card">

    <div class="form-grid">

      <div class="form-group">

        <label for="tanggalPresensi">
          Tanggal
        </label>

        <input
          type="date"
          id="tanggalPresensi"
        >

      </div>


      <div class="form-group">

        <label for="kelasPresensi">
          Kelas
        </label>

        <select id="kelasPresensi">

          <option value="">
            Pilih kelas
          </option>

        </select>

      </div>

    </div>


    <div class="form-actions">

      <button
        class="btn btn-primary"
        id="btnTampilkanSiswa"
      >
        Tampilkan Siswa
      </button>

    </div>

  </section>


  <section class="card">

    <div class="card-header">

      <h2>Daftar Siswa</h2>

      <div id="presensiSummary"></div>

    </div>


    <div class="table-wrapper">

      <table>

        <thead>

          <tr>

            <th>No</th>
            <th>NISN</th>
            <th>Nama Siswa</th>
            <th>Kelas</th>
            <th>JK</th>
            <th>Status</th>

          </tr>

        </thead>


        <tbody id="presensiTableBody">

          <tr>

            <td
              colspan="6"
              class="text-center"
            >
              Silakan pilih kelas.

            </td>

          </tr>

        </tbody>

      </table>

    </div>


    <div class="form-actions">

      <button
        class="btn btn-primary"
        id="btnSimpanPresensi"
      >
        Simpan Presensi
      </button>

    </div>


    <div
      id="presensiMessage"
      class="message"
      style="display:none;"
    ></div>

  </section>

</main>


<script src="auth.js"></script>
<script src="presensi.js"></script>
<script src="pwa.js"></script>

</body>
</html>
