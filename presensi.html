<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Presensi Manual</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <div class="card">

    <div class="card-header">

      <div class="card-title">

        <i class="fa-solid fa-calendar-check"></i>

        Presensi Manual

      </div>


      <button
        id="refreshButton"
        class="btn btn-secondary"
        type="button"
      >

        <i class="fa-solid fa-rotate"></i>

        Refresh

      </button>

    </div>


    <div class="card-body">


      <!-- PESAN -->

      <div
        id="presensiMessage"
        class="alert"
        style="display:none"
      ></div>


      <!-- COUNTER -->

      <div
        id="presensiCounter"
        class="presensi-counter"
      >

        Hadir: 0 |
        Sakit: 0 |
        Izin: 0 |
        Alpa: 0

      </div>


      <!-- TOOLBAR -->

      <div class="toolbar">


        <select
          id="kelasSelect"
        >

          <option value="">
            Semua Kelas
          </option>

        </select>


        <input
          id="searchInput"
          type="text"
          placeholder="Cari NISN atau nama siswa..."
        >


        <button
          id="simpanButton"
          class="btn btn-primary"
          type="button"
        >

          <i class="fa-solid fa-save"></i>

          Simpan Semua

        </button>


      </div>


      <!-- TABLE -->

      <div class="table-responsive">

        <table>

          <thead>

            <tr>

              <th>No</th>

              <th>NISN</th>

              <th>Nama</th>

              <th>Kelas</th>

              <th>L/P</th>

              <th>Status</th>

              <th>Aksi</th>

            </tr>

          </thead>


          <tbody id="siswaTable">

            <tr>

              <td
                colspan="7"
                class="loading"
              >

                Memuat data siswa...

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>


  <!-- API -->

  <script src="api.js"></script>

  <!-- AUTH -->

  <script src="auth.js"></script>

  <!-- LAYOUT -->

  <script src="layout.js"></script>

  <!-- PRESENSI -->

  <script src="presensi.js"></script>

  <!-- PWA -->

  <script src="pwa.js"></script>


</body>

</html>
