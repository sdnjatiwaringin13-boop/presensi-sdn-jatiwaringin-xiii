<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Presensi - SDN Jatiwaringin XIII
    </title>


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="card">

        <div class="card-header">

            <div class="card-title">

                <i class="fa-solid fa-calendar-check"></i>

                Presensi Siswa

            </div>

        </div>


        <div class="card-body">

            <!--
                KONTEN PRESENSI LAMA
                tetap digunakan oleh presensi.js
            -->

            <div id="presensiMessage"></div>


            <div class="form-grid">

                <div class="form-group">

                    <label for="pilihKelas">
                        Kelas
                    </label>

                    <select
                        id="pilihKelas"
                    >

                        <option value="">
                            Pilih Kelas
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="tanggal">
                        Tanggal
                    </label>

                    <input
                        type="date"
                        id="tanggal"
                    >

                </div>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>No</th>
                            <th>NISN</th>
                            <th>Nama</th>
                            <th>Kelas</th>
                            <th>Status</th>
                            <th>Aksi</th>

                        </tr>

                    </thead>


                    <tbody
                        id="presensiTableBody"
                    ></tbody>

                </table>

            </div>

        </div>

    </div>


    <script src="auth.js"></script>
    <script src="layout.js"></script>
    <script src="presensi.js"></script>
    <script src="pwa.js"></script>

</body>

</html>
