<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Presensi Siswa
  </title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <div class="card">

    <div class="card-header">

      <div class="card-title">
        <i class="fa-solid fa-calendar-check"></i>
        Presensi Siswa
      </div>

      <button
        type="button"
        id="refreshButton"
        class="btn btn-secondary"
      >
        <i class="fa-solid fa-rotate"></i>
        Refresh
      </button>

    </div>

    <div class="card-body">

      <div
        id="presensiMessage"
        style="display:none;"
      ></div>

      <div class="toolbar">

        <select id="kelasSelect">

          <option value="">
            Semua Kelas
          </option>

        </select>

        <input
          type="text"
          id="searchInput"
          placeholder="Cari NISN atau nama siswa..."
        >

        <button
          type="button"
          id="simpanButton"
          class="btn btn-primary"
        >
          Simpan Semua
        </button>

      </div>

      <div class="table-wrapper">

        <table>

          <thead>
            <tr>
              <th>No</th>
              <th>NISN</th>
              <th>Nama Siswa</th>
              <th>Kelas</th>
              <th>L/P</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>

          <tbody id="siswaTable"></tbody>

        </table>

      </div>

    </div>

  </div>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="layout.js"></script>
  <script src="presensi.js"></script>
  <script src="pwa.js"></script>

</body>
</html>
