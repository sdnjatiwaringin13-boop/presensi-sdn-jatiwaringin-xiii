<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kartu Siswa</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    /* =====================================================
       HALAMAN
    ===================================================== */

    .kartu-page {
      width: 100%;
      box-sizing: border-box;
    }


    /* =====================================================
       TOOLBAR
    ===================================================== */

    .kartu-toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }


    .kartu-toolbar input,
    .kartu-toolbar select {
      width: 100%;
      height: 38px;
      padding: 0 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
      background: #fff;
    }


    .kartu-toolbar-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }


    /* =====================================================
       CONTAINER KARTU
    ===================================================== */

    #kartuContainer {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(
            260px,
            1fr
          )
        );

      gap: 20px;

      align-items: start;

    }


    /* =====================================================
       KARTU SISWA
       
       UKURAN:
       53.98mm x 85.60mm
       PORTRAIT
    ===================================================== */

    .kartu-siswa {

      position: relative;

      width: 53.98mm;

      height: 85.60mm;

      min-width: 53.98mm;

      min-height: 85.60mm;

      max-width: 53.98mm;

      max-height: 85.60mm;

      box-sizing: border-box;

      background: #ffffff;

      border: 0.35mm solid #1684b8;

      border-radius: 3mm;

      overflow: hidden;

      display: flex;

      flex-direction: column;

      margin: 0 auto;

      box-shadow:
        0 4px 14px
        rgba(
          0,
          0,
          0,
          0.12
        );

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #111827;

    }


    /* =====================================================
       HEADER KARTU
    ===================================================== */

    .kartu-header {

      height: 16mm;

      min-height: 16mm;

      background:
        linear-gradient(
          135deg,
          #1684b8,
          #2797ca
        );

      color: #ffffff;

      display: flex;

      align-items: center;

      padding:
        3mm;

      box-sizing: border-box;

    }


    .kartu-logo {

      width: 10mm;

      height: 10mm;

      min-width: 10mm;

      border-radius: 2mm;

      background: #ffffff;

      color: #1684b8;

      display: flex;

      align-items: center;

      justify-content: center;

      font-weight: 900;

      font-size: 12px;

      margin-right: 2.5mm;

    }


    .kartu-sekolah {

      min-width: 0;

      line-height: 1.15;

    }


    .kartu-sekolah-nama {

      font-size: 7px;

      font-weight: 800;

      text-transform: uppercase;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }


    .kartu-subtitle {

      font-size: 5px;

      margin-top: 1mm;

      opacity: 0.95;

      text-transform: uppercase;

    }


    /* =====================================================
       BODY
    ===================================================== */

    .kartu-body {

      flex: 1;

      display: flex;

      flex-direction: column;

      box-sizing: border-box;

      padding:
        3mm;

    }


    .kartu-nama {

      font-size: 9px;

      font-weight: 800;

      line-height: 1.2;

      margin-bottom: 2.5mm;

      min-height: 5mm;

      word-break: break-word;

    }


    /* =====================================================
       DATA SISWA
    ===================================================== */

    .kartu-data {

      display: grid;

      grid-template-columns:
        12mm
        3mm
        1fr;

      row-gap: 1.4mm;

      font-size: 6.5px;

      line-height: 1.2;

    }


    .kartu-data-label {

      font-weight: 600;

      color: #4b5563;

    }


    .kartu-data-separator {

      text-align: center;

      color: #6b7280;

    }


    .kartu-data-value {

      font-weight: 600;

      overflow-wrap: anywhere;

    }


    /* =====================================================
       AREA QR
       
       HANYA SATU QR
    ===================================================== */

    .kartu-qr-area {

      margin-top: auto;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding-top: 2mm;

    }


    .kartu-qr {

      width: 29mm;

      height: 29mm;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #ffffff;

    }


    .kartu-qr img {

      display: block;

      width: 29mm;

      height: 29mm;

      object-fit: contain;

    }


    .kartu-qr-caption {

      margin-top: 1mm;

      font-size: 5px;

      color: #6b7280;

      text-align: center;

    }


    /* =====================================================
       FOOTER
    ===================================================== */

    .kartu-footer {

      font-size: 4.8px;

      color: #6b7280;

      text-align: center;

      padding-bottom: 2mm;

    }


    /* =====================================================
       EMPTY
    ===================================================== */

    .kartu-empty {

      padding: 30px;

      text-align: center;

      color: #6b7280;

      background: #f9fafb;

      border:
        1px dashed
        #d1d5db;

      border-radius: 8px;

    }


    /* =====================================================
       PRINT
    ===================================================== */

    @media print {

      @page {

        size:
          53.98mm
          85.60mm;

        margin: 0;

      }


      html,
      body {

        width:
          53.98mm;

        margin: 0 !important;

        padding: 0 !important;

        background: #ffffff !important;

      }


      body * {

        visibility: hidden;

      }


      #kartuContainer,
      #kartuContainer * {

        visibility: visible;

      }


      #kartuContainer {

        display: block;

        width:
          53.98mm;

        margin: 0;

        padding: 0;

      }


      .kartu-siswa {

        display: flex;

        width:
          53.98mm !important;

        height:
          85.60mm !important;

        min-width:
          53.98mm !important;

        min-height:
          85.60mm !important;

        max-width:
          53.98mm !important;

        max-height:
          85.60mm !important;

        margin: 0;

        border-radius: 0;

        box-shadow: none;

        page-break-after: always;

        break-after: page;

      }


      .kartu-siswa:last-child {

        page-break-after: auto;

        break-after: auto;

      }


      .no-print {

        display: none !important;

      }

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media screen and (max-width: 600px) {

      #kartuContainer {

        grid-template-columns:
          1fr;

      }

    }

  </style>

</head>


<body>


  <div class="card kartu-page">


    <!-- =================================================
         HEADER
    ================================================= -->

    <div class="card-header no-print">

      <div class="card-title">

        <i class="fa-solid fa-id-card"></i>

        Kartu Siswa

      </div>


      <button
        id="cetakButton"
        class="btn btn-primary"
        type="button"
      >

        <i class="fa-solid fa-print"></i>

        Cetak

      </button>

    </div>


    <div class="card-body">


      <!-- =================================================
           FILTER
      ================================================= -->

      <div class="kartu-toolbar no-print">


        <input
          id="searchInput"
          type="text"
          placeholder="Cari siswa..."
          autocomplete="off"
        >


        <select
          id="kelasSelect"
        >

          <option value="">
            Semua Kelas
          </option>

        </select>


        <div class="kartu-toolbar-actions">

          <button
            id="refreshButton"
            class="btn btn-secondary"
            type="button"
          >

            <i class="fa-solid fa-rotate"></i>

            Refresh

          </button>

        </div>


      </div>


      <!-- =================================================
           KARTU
      ================================================= -->

      <div
        id="kartuContainer"
      >

        <div class="kartu-empty">

          <i class="fa-solid fa-spinner fa-spin"></i>

          Memuat data siswa...

        </div>

      </div>


    </div>

  </div>


  <!-- =====================================================
       SCRIPT
  ===================================================== -->

  <script src="api.js"></script>

  <script src="auth.js"></script>

  <script src="layout.js"></script>

  <script src="kartu.js"></script>

  <script src="pwa.js"></script>


</body>

</html>
