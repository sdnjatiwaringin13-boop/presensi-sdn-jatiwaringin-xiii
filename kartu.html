<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kartu QR Siswa</title>

  <meta
    name="theme-color"
    content="#1565c0"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<header class="topbar no-print">

  <div class="topbar-left">

    <div class="topbar-logo">
      SD
    </div>

    <div>

      <div class="topbar-title">
        Kartu QR Siswa
      </div>

      <div class="topbar-school">
        SD Negeri Jatiwaringin XIII
      </div>

    </div>

  </div>


  <div class="topbar-right">

    <button
      class="btn btn-secondary btn-small"
      onclick="location.href='dashboard.html'"
    >
      Dashboard
    </button>

    <button
      class="btn btn-primary btn-small"
      onclick="window.print()"
    >
      Cetak
    </button>

    <button
      class="btn btn-danger btn-small"
      onclick="Auth.logout()"
    >
      Keluar
    </button>

  </div>

</header>


<main class="container">

  <div class="page-header no-print">

    <div>

      <h1>Kartu QR Siswa</h1>

      <p>
        QR Code digunakan untuk presensi siswa.
      </p>

    </div>

  </div>


  <section class="card no-print">

    <div class="toolbar">

      <div class="form-group">

        <label for="kartuKelas">
          Kelas
        </label>

        <select id="kartuKelas">

          <option value="">
            Semua Kelas
          </option>

        </select>

      </div>


      <div class="form-group">

        <label for="kartuSearch">
          Cari Siswa
        </label>

        <input
          type="search"
          id="kartuSearch"
          placeholder="Nama / NISN"
        >

      </div>

    </div>

  </section>


  <section>

    <div
      id="kartuContainer"
      class="kartu-grid"
    >

      <div class="card">
        Memuat kartu...
      </div>

    </div>

  </section>

</main>


<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="auth.js"></script>
<script src="kartu.js"></script>
<script src="pwa.js"></script>

</body>
</html>
