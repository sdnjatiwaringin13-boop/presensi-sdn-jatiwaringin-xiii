<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kartu Siswa - SD Negeri Jatiwaringin XIII</title>


    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- STYLE UTAMA DASHBOARD -->
    <link
        rel="stylesheet"
        href="style.css"
    >


    <style>

        /* =====================================================
           HALAMAN KARTU
        ===================================================== */

        .kartu-page {
            width: 100%;
        }


        /* =====================================================
           TOOLBAR
        ===================================================== */

        .kartu-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }


        .kartu-toolbar .search-box {
            position: relative;
            flex: 1;
            min-width: 220px;
        }


        .kartu-toolbar .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 12px;
        }


        .kartu-toolbar input {
            width: 100%;
            height: 38px;

            padding: 0 12px 0 35px;

            border: 1px solid #dfe4e7;
            border-radius: 6px;

            background: #fff;

            font-family: inherit;
            font-size: 12px;

            outline: none;
        }


        .kartu-toolbar input:focus {
            border-color: #3b94bd;
            box-shadow: 0 0 0 2px rgba(59,148,189,.08);
        }


        .kartu-toolbar select {
            height: 38px;
            min-width: 150px;

            padding: 0 12px;

            border: 1px solid #dfe4e7;
            border-radius: 6px;

            background: #fff;

            font-family: inherit;
            font-size: 12px;

            outline: none;
        }


        .kartu-toolbar button {
            height: 38px;

            padding: 0 14px;

            border: 0;
            border-radius: 6px;

            font-family: inherit;
            font-size: 12px;
            font-weight: 700;

            cursor: pointer;
        }


        #refreshButton {
            background: #eef3f6;
            color: #52616a;
        }


        #refreshButton:hover {
            background: #e1e8ec;
        }


        #printButton {
            background: #3b94bd;
            color: #fff;
        }


        #printButton:hover {
            background: #287ba3;
        }


        /* =====================================================
           CONTAINER KARTU
        ===================================================== */

        #kartuContainer {

            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(250px, 1fr)
                );

            gap: 18px;

            align-items: start;
        }


        /* =====================================================
           KARTU PELAJAR
           UKURAN ASLI KTP PORTRAIT
        ===================================================== */

        .student-card {

            position: relative;

            width: 53.98mm;
            height: 85.60mm;

            min-width: 53.98mm;
            max-width: 53.98mm;

            min-height: 85.60mm;
            max-height: 85.60mm;

            overflow: hidden;

            background: #f7f7f7;

            border-radius: 3mm;

            box-shadow:
                0 5px 16px rgba(0,0,0,.16);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #111;

            page-break-inside: avoid;
            break-inside: avoid;
        }


        /* =====================================================
           HEADER MERAH
        ===================================================== */

        .student-card .card-red {

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 25mm;

            background:
                linear-gradient(
                    135deg,
                    #ff3036 0%,
                    #d71920 100%
                );

            border-radius:
                0 0 4mm 0;

            z-index: 1;
        }


        /* =====================================================
           HEADER ABU-ABU
        ===================================================== */

        .student-card .card-gray {

            position: absolute;

            left: 0;
            top: 6mm;

            width: 60%;
            height: 7mm;

            background: #d5d5d5;

            border-radius:
                0 4mm 4mm 0;

            z-index: 2;
        }


        /* =====================================================
           HEADER KUNING
        ===================================================== */

        .student-card .card-yellow {

            position: absolute;

            left: 0;
            top: 12mm;

            width: 25%;
            height: 5mm;

            background: #ffc21c;

            border-radius:
                0 3mm 3mm 0;

            z-index: 3;
        }


        /* =====================================================
           BULATAN ATAS
        ===================================================== */

        .card-circles {

            position: absolute;

            top: 1.2mm;
            left: 3mm;

            display: flex;

            gap: 1.7mm;

            z-index: 10;
        }


        .card-circles span {

            width: 2.7mm;
            height: 2.7mm;

            border-radius: 50%;

            background: #ffc21c;
        }


        /* =====================================================
           DOT KUNING
        ===================================================== */

        .card-dots {

            position: absolute;

            top: 2mm;
            right: 2mm;

            width: 17mm;
            height: 12mm;

            background-image:
                radial-gradient(
                    #ffc21c 1px,
                    transparent 1px
                );

            background-size:
                3mm 3mm;

            z-index: 4;
        }


        /* =====================================================
           JUDUL SEKOLAH
        ===================================================== */

        .student-card .school-name {

            position: absolute;

            top: 9mm;
            left: 4mm;
            right: 4mm;

            color: #fff;

            text-align: center;

            font-size: 4mm;

            line-height: 1.12;

            font-weight: 900;

            z-index: 20;

            text-shadow:
                0 1px 1px rgba(0,0,0,.2);
        }


        /* =====================================================
           JUDUL KARTU
        ===================================================== */

        .student-card .card-heading {

            position: absolute;

            top: 26mm;

            left: 0;
            right: 0;

            text-align: center;

            font-size: 4.4mm;

            line-height: 1;

            font-weight: 900;

            z-index: 20;
        }


        /* =====================================================
           QR CODE
           HANYA SATU
        ===================================================== */

        .student-card .qr-box {

            position: absolute;

            top: 32mm;
            left: 50%;

            transform:
                translateX(-50%);

            width: 27mm;
            height: 27mm;

            padding: 1mm;

            background: #fff;

            border:
                .6mm solid #d71920;

            border-radius: 1.5mm;

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 20;
        }


        .student-card .qr-code {

            width: 24mm;
            height: 24mm;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #fff;

            overflow: hidden;
        }


        .student-card .qr-code {
    width: 26mm;
    height: 26mm;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #fff;
    overflow: hidden;
}


        .student-card .qr-code img {
    display: block !important;

    width: 26mm !important;
    height: 26mm !important;

    max-width: none !important;
    max-height: none !important;

    margin: 0 !important;
    padding: 0 !important;
}


        /* =====================================================
           DATA SISWA
        ===================================================== */

        .student-card .student-data {

            position: absolute;

            left: 4.5mm;
            right: 3.5mm;

            top: 61mm;

            z-index: 20;
        }


        .student-card .data-row {

            display: grid;

            grid-template-columns:
                16mm 3mm 1fr;

            align-items: center;

            min-height: 6mm;

            font-size: 2.7mm;

            line-height: 1.1;
        }


        .student-card .data-label {

            font-weight: 800;

            white-space: nowrap;
        }


        .student-card .data-colon {

            font-weight: 800;

            text-align: center;
        }


        .student-card .data-value {

            min-width: 0;

            font-weight: 500;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .card-footer-red {

            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 4mm;

            background: #ff2930;

            z-index: 5;
        }


        .card-footer-yellow {

            position: absolute;

            right: -2mm;
            bottom: 0;

            width: 9mm;
            height: 4mm;

            background: #ffc21c;

            transform: skewX(-35deg);

            z-index: 6;
        }


        .card-chevron {

            position: absolute;

            left: 3mm;
            bottom: 2.5mm;

            width: 14mm;
            height: 4mm;

            z-index: 20;
        }


        .card-chevron span {

            position: absolute;

            top: 0;

            width: 6mm;
            height: 2mm;

            background: #444;

            transform: skewX(-40deg);
        }


        .card-chevron span:nth-child(1) {
            left: 0;
        }

        .card-chevron span:nth-child(2) {
            left: 3mm;
        }

        .card-chevron span:nth-child(3) {
            left: 6mm;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .kartu-loading {

            grid-column: 1 / -1;

            padding: 40px;

            text-align: center;

            color: #888;
        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .kartu-empty {

            grid-column: 1 / -1;

            padding: 40px;

            text-align: center;

            background: #fff;

            border:
                1px solid #e5e5e5;

            border-radius: 8px;

            color: #888;
        }


        /* =====================================================
           PRINT
        ===================================================== */

        @media print {

            html,
            body {

                margin: 0 !important;
                padding: 0 !important;

                width: 210mm;
                min-height: 297mm;

                background: #fff !important;
            }


            /* SEMBUNYIKAN DASHBOARD */

            .app-sidebar,
            .app-topbar,
            .mobile-overlay,
            .kartu-toolbar,
            .page-breadcrumb,
            .card-header,
            .no-print {

                display: none !important;
            }


            .app-main {

                margin: 0 !important;

                width: 210mm !important;

                min-height: 297mm !important;
            }


            .app-page-content {

                margin: 0 !important;

                padding: 0 !important;

                width: 210mm !important;
            }


            .legacy-page-content {

                margin: 0 !important;

                padding: 0 !important;

                width: 210mm !important;
            }


            .card {

                margin: 0 !important;

                padding: 0 !important;

                border: 0 !important;

                box-shadow: none !important;

                background: transparent !important;
            }


            .card-body {

                margin: 0 !important;

                padding: 0 !important;
            }


            #kartuContainer {

                width: 210mm !important;

                margin: 0 !important;

                padding: 8mm !important;

                display: grid !important;

                grid-template-columns:
                    repeat(
                        3,
                        53.98mm
                    ) !important;

                grid-template-rows:
                    repeat(
                        3,
                        85.60mm
                    ) !important;

                column-gap: 5mm !important;

                row-gap: 5mm !important;

                align-items: start !important;

                justify-content: start !important;
            }


            .student-card {

                width: 53.98mm !important;

                height: 85.60mm !important;

                min-width: 53.98mm !important;

                max-width: 53.98mm !important;

                min-height: 85.60mm !important;

                max-height: 85.60mm !important;

                margin: 0 !important;

                padding: 0 !important;

                box-shadow: none !important;

                border:
                    0.2mm solid #ddd !important;

                border-radius: 3mm !important;

                overflow: hidden !important;

                page-break-inside: avoid !important;

                break-inside: avoid !important;

                print-color-adjust: exact !important;

                -webkit-print-color-adjust: exact !important;
            }


            .student-card .qr-code canvas {
    display: block !important;

    width: 26mm !important;
    height: 26mm !important;

    max-width: none !important;
    max-height: none !important;

    margin: 0 !important;
    padding: 0 !important;
}


            @page {

                size: A4 portrait;

                margin: 0;
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media screen and (max-width: 700px) {

            #kartuContainer {

                grid-template-columns:
                    1fr;

                justify-items: center;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         CARD DASHBOARD
    ===================================================== -->

    <div class="card kartu-page">


        <!-- HEADER DASHBOARD -->

        <div class="card-header">

            <div class="card-title">

                <i class="fa-solid fa-id-card"></i>

                Kartu Siswa

            </div>


            <button
                type="button"
                id="printButton"
                class="btn btn-primary"
            >

                <i class="fa-solid fa-print"></i>

                Cetak Kartu

            </button>

        </div>


        <!-- BODY -->

        <div class="card-body">


            <!-- TOOLBAR -->

            <div class="kartu-toolbar no-print">


                <div class="search-box">

                    <i class="fa-solid fa-search"></i>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Cari nama atau NISN..."
                        autocomplete="off"
                    >

                </div>


                <select id="kelasFilter">

                    <option value="">
                        Semua Kelas
                    </option>

                </select>


                <button
                    type="button"
                    id="refreshButton"
                >

                    <i class="fa-solid fa-rotate"></i>

                    Refresh

                </button>


            </div>


            <!-- CONTAINER KARTU -->

            <div id="kartuContainer">

                <div class="kartu-loading">

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    Memuat kartu siswa...

                </div>

            </div>


        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->


    <!-- API -->

    <script src="api.js"></script>


    <!-- AUTH -->

    <script src="auth.js"></script>


    <!-- LAYOUT DASHBOARD -->

    <script src="layout.js"></script>


    <!-- SATU-SATUNYA QR LIBRARY -->

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>


    <!-- KARTU -->

    <script src="kartu.js"></script>


    <!-- PWA -->

    <script src="pwa.js"></script>


</body>

</html>
