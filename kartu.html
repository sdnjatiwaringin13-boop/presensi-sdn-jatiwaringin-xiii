<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kartu Siswa</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    .kartu-toolbar {

      display: flex;

      flex-direction: column;

      gap: 10px;

      margin-bottom: 20px;

    }


    .kartu-toolbar input,
    .kartu-toolbar select {

      width: 100%;

      height: 40px;

      padding:
        0 12px;

      border:
        1px solid #d1d5db;

      border-radius:
        6px;

      box-sizing:
        border-box;

      background:
        #fff;

    }


    .kartu-actions {

      display: flex;

      gap: 8px;

    }


    #kartuContainer {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(
            280px,
            1fr
          )
        );

      gap: 20px;

      align-items: start;

    }


    /* =====================================================
       UKURAN KTP PORTRAIT
    ===================================================== */

    .student-card {

      width:
        53.98mm;

      height:
        85.60mm;

      min-width:
        53.98mm;

      min-height:
        85.60mm;

      max-width:
        53.98mm;

      max-height:
        85.60mm;

      margin:
        0 auto;

      box-sizing:
        border-box;

      overflow:
        hidden;

      background:
        #ffffff;

      border:
        0.35mm solid #1684b8;

      border-radius:
        3mm;

      box-shadow:
        0 5px 15px
        rgba(
          0,
          0,
          0,
          .12
        );

      display:
        flex;

      flex-direction:
        column;

      font-family:
        Arial,
        sans-serif;

    }


    /* HEADER */

    .student-card-head {

      height:
        16mm;

      min-height:
        16mm;

      display:
        flex;

      align-items:
        center;

      padding:
        3mm;

      box-sizing:
        border-box;

      background:
        linear-gradient(
          135deg,
          #1684b8,
          #2999cb
        );

      color:
        #ffffff;

    }


    .school-mark {

      width:
        10mm;

      height:
        10mm;

      min-width:
        10mm;

      border-radius:
        2mm;

      background:
        #ffffff;

      color:
        #1684b8;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      font-weight:
        900;

      font-size:
        12px;

      margin-right:
        2.5mm;

    }


    .student-card-head strong {

      display:
        block;

      font-size:
        7px;

      line-height:
        1.2;

      white-space:
        nowrap;

    }


    .student-card-head small {

      display:
        block;

      margin-top:
        1mm;

      font-size:
        5px;

    }


    /* BODY */

    .student-card-body {

      flex:
        1;

      display:
        flex;

      flex-direction:
        column;

      padding:
        3mm;

      box-sizing:
        border-box;

    }


    .student-info h3 {

      margin:
        0 0 3mm;

      font-size:
        9px;

      line-height:
        1.2;

      font-weight:
        800;

    }


    .student-info p {

      display:
        grid;

      grid-template-columns:
        12mm 1fr;

      margin:
        0 0 1.5mm;

      font-size:
        6.5px;

    }


    .student-info p b {

      color:
        #4b5563;

    }


    /* QR */

    .qr-wrap {

      margin-top:
        auto;

      display:
        flex;

      flex-direction:
        column;

      align-items:
        center;

      justify-content:
        center;

      padding-top:
        2mm;

    }


    .qr-code {

      width:
        30mm;

      height:
        30mm;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      background:
        #ffffff;

    }


    .qr-code img,
    .qr-code canvas {

      width:
        30mm !important;

      height:
        30mm !important;

      display:
        block;

    }


    .qr-wrap small {

      margin-top:
        1mm;

      font-size:
        5px;

      color:
        #6b7280;

    }


    /* EMPTY */

    .empty {

      padding:
        30px;

      text-align:
        center;

      color:
        #6b7280;

    }


    /* =====================================================
       PRINT
    ===================================================== */

    @media print {

      @page {

        size:
          53.98mm
          85.60mm;

        margin:
          0;

      }


      html,
      body {

        margin:
          0 !important;

        padding:
          0 !important;

        width:
          53.98mm;

        background:
          #ffffff !important;

      }


      body * {

        visibility:
          hidden;

      }


      #kartuContainer,
      #kartuContainer * {

        visibility:
          visible;

      }


      #kartuContainer {

        display:
          block;

        width:
          53.98mm;

        margin:
          0;

        padding:
          0;

      }


      .student-card {

        width:
          53.98mm !important;

        height:
          85.60mm !important;

        min-width:
          53.98mm !important;

        min-height:
          85.60mm !important;

        max-width:
          53.98mm !important;

        max-height:
          85.60mm !important;

        margin:
          0;

        border-radius:
          0;

        box-shadow:
          none;

        page-break-after:
          always;

        break-after:
          page;

      }


      .student-card:last-child {

        page-break-after:
          auto;

        break-after:
          auto;

      }


      .no-print {

        display:
          none !important;

      }

    }

  </style>

</head>


<body>


  <div class="card">


    <div class="card-header no-print">

      <div class="card-title">

        <i class="fa-solid fa-id-card"></i>

        Kartu Siswa

      </div>


      <button
        id="printButton"
        class="btn btn-primary"
        type="button"
      >

        <i class="fa-solid fa-print"></i>

        Cetak

      </button>

    </div>


    <div class="card-body">


      <div class="kartu-toolbar no-print">


        <input
          id="searchInput"
          type="text"
          placeholder="Cari siswa..."
          autocomplete="off"
        >


        <select
          id="kelasFilter"
        >

          <option value="">
            Semua Kelas
          </option>

        </select>


        <div class="kartu-actions">

          <button
            id="refreshButton"
            class="btn btn-secondary"
            type="button"
          >

            <i class="fa-solid fa-rotate"></i>

            Refresh

          </button>

        </div>


      </div>


      <div id="kartuContainer">

        <div class="loading">

          Memuat kartu siswa...

        </div>

      </div>


    </div>

  </div>


  <script src="api.js"></script>

  <script src="auth.js"></script>

  <script src="layout.js"></script>

  <script src="kartu.js"></script>

  <script src="pwa.js"></script>

</body>

</html>
