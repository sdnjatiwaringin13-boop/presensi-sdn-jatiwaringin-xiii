<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Data Kelas - Presensi SDN Jatiwaringin XIII
  </title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <div class="card">

    <div class="card-header">

      <div class="card-title">
        <i class="fa-solid fa-school"></i>
        Data Kelas
      </div>

      <button
        type="button"
        id="tambahButton"
        class="btn btn-primary"
      >
        <i class="fa-solid fa-plus"></i>
        Tambah Kelas
      </button>

    </div>

    <div class="card-body">

      <div
        id="kelasMessage"
        style="display:none;"
      ></div>

      <div class="toolbar">

        <input
          type="text"
          id="searchInput"
          placeholder="Cari kelas..."
        >

        <select id="guruFilter">
          <option value="">
            Semua Guru
          </option>
        </select>

        <select id="statusFilter">
          <option value="">
            Semua Status
          </option>

          <option value="AKTIF">
            AKTIF
          </option>

          <option value="NONAKTIF">
            NONAKTIF
          </option>
        </select>

        <button
          type="button"
          id="refreshButton"
          class="btn btn-secondary"
        >
          Refresh
        </button>

      </div>

      <div
        id="formKelas"
        style="
          display:none;
          margin-bottom:20px;
        "
      >

        <h3 id="formTitle">
          Tambah Kelas
        </h3>

        <form id="kelasForm">

          <div class="form-grid">

            <div class="form-group">
              <label>ID Kelas</label>

              <input
                type="text"
                id="inputIDKelas"
                required
              >
            </div>

            <div class="form-group">
              <label>Nama Kelas</label>

              <input
                type="text"
                id="inputNamaKelas"
                required
              >
            </div>

            <div class="form-group">
              <label>Wali Kelas</label>

              <select
                id="inputIDGuru"
                required
              >
                <option value="">
                  Pilih Guru
                </option>
              </select>
            </div>

            <div class="form-group">
              <label>Tahun Ajaran</label>

              <input
                type="text"
                id="inputTahunAjaran"
                placeholder="2026/2027"
              >
            </div>

            <div class="form-group">
              <label>Status</label>

              <select id="inputStatus">
                <option value="AKTIF">
                  AKTIF
                </option>

                <option value="NONAKTIF">
                  NONAKTIF
                </option>
              </select>
            </div>

          </div>

          <button
            type="submit"
            class="btn btn-primary"
          >
            Simpan
          </button>

          <button
            type="button"
            id="cancelButton"
            class="btn btn-secondary"
          >
            Batal
          </button>

        </form>

      </div>

      <p>
        Total Kelas:
        <strong id="jumlahKelas">
          0
        </strong>
      </p>

      <div class="table-wrapper">

        <table>

          <thead>
            <tr>
              <th>No</th>
              <th>ID Kelas</th>
              <th>Nama Kelas</th>
              <th>Wali Kelas</th>
              <th>Tahun Ajaran</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>

          <tbody id="kelasTable"></tbody>

        </table>

      </div>

    </div>

  </div>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="layout.js"></script>
  <script src="kelas.js"></script>
  <script src="pwa.js"></script>

</body>
</html>
