<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Data Kelas - Presensi</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

<header class="topbar">
  <div>
    <h1>Presensi Sekolah</h1>
    <span>SD Negeri Jatiwaringin XIII</span>
  </div>

  <div>
    <button
      class="logout-button"
      onclick="location.href='admin.html'">
      Dashboard
    </button>

    <button
      id="logoutButton"
      class="logout-button">
      Logout
    </button>
  </div>
</header>

<main class="dashboard-container">

  <section class="welcome">
    <h2>Data Kelas</h2>
    <p id="adminName">Memuat data...</p>
  </section>


  <!-- FORM TAMBAH / EDIT -->
  <section class="panel">

    <div class="panel-header">
      <h2 id="formTitle">Tambah Kelas</h2>
    </div>

    <form id="kelasForm">

      <input
        type="hidden"
        id="mode"
        value="tambah">

      <div class="form-grid">

        <div>
          <label>ID Kelas</label>
          <input
            type="text"
            id="idKelas"
            placeholder="Contoh: KLS01"
            required>
        </div>

        <div>
          <label>Nama Kelas</label>
          <input
            type="text"
            id="namaKelas"
            placeholder="Contoh: 1A"
            required>
        </div>

        <div>
          <label>Wali Kelas</label>

          <select id="idGuru" required>
            <option value="">Memuat guru...</option>
          </select>

        </div>

        <div>
          <label>Tahun Ajaran</label>

          <input
            type="text"
            id="tahunAjaran"
            placeholder="Contoh: 2026/2027"
            required>

        </div>

        <div>
          <label>Status</label>

          <select id="status" required>
            <option value="AKTIF">AKTIF</option>
            <option value="NONAKTIF">NONAKTIF</option>
          </select>

        </div>

      </div>

      <div style="margin-top:20px">

        <button
          type="submit"
          class="login-button"
          id="saveButton">
          Simpan
        </button>

        <button
          type="button"
          class="logout-button"
          id="cancelButton">
          Batal
        </button>

      </div>

      <p id="formMessage"></p>

    </form>

  </section>


  <!-- DATA KELAS -->
  <section class="panel">

    <div class="panel-header">

      <h2>Daftar Kelas</h2>

      <button
        type="button"
        class="login-button"
        id="refreshButton">
        Refresh
      </button>

    </div>


    <div style="margin-bottom:20px">

      <input
        type="text"
        id="searchInput"
        placeholder="Cari kelas / wali kelas..."
        style="width:100%;max-width:400px;padding:10px">

    </div>


    <div class="table-wrapper">

      <table>

        <thead>

          <tr>
            <th>No</th>
            <th>ID Kelas</th>
            <th>Nama Kelas</th>
            <th>Wali Kelas</th>
            <th>Tahun Ajaran</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>

        </thead>

        <tbody id="kelasTable">

          <tr>
            <td
              colspan="7"
              class="loading">
              Memuat data...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>


<script src="./kelas.js"></script>

</body>
</html>
