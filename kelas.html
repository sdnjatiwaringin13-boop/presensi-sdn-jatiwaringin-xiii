<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Data Kelas</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="style.css"></head><body><div class="card"><div class="card-header"><div class="card-title"><i class="fa-solid fa-school"></i> Data Kelas</div><button id="tambahButton" class="btn btn-primary" type="button">Tambah Kelas</button></div><div class="card-body"><div class="toolbar"><input id="searchInput" placeholder="Cari kelas..."><select id="guruFilter"><option value="">Semua Guru</option></select><select id="statusFilter"><option value="">Semua Status</option><option value="AKTIF">AKTIF</option><option value="NONAKTIF">NONAKTIF</option></select><button id="refreshButton" class="btn btn-secondary" type="button">Refresh</button></div><div id="formKelas" style="display:none"><h3 id="formTitle">Tambah Kelas</h3><form id="kelasForm"><div class="form-grid"><div class="form-group"><label>ID Kelas</label><input id="inputIDKelas" required></div><div class="form-group"><label>Nama Kelas</label><input id="inputNamaKelas" required></div><div class="form-group"><label>Wali Kelas</label><select id="inputIDGuru" required><option value="">Pilih Guru</option></select></div><div class="form-group"><label>Tahun Ajaran</label><input id="inputTahunAjaran" placeholder="2026/2027"></div><div class="form-group"><label>Status</label><select id="inputStatus"><option value="AKTIF">AKTIF</option><option value="NONAKTIF">NONAKTIF</option></select></div></div><button class="btn btn-primary" type="submit">Simpan</button><button id="cancelButton" class="btn btn-secondary" type="button">Batal</button></form></div><p>Total Kelas: <strong id="jumlahKelas">0</strong></p><div class="table-responsive"><table><thead><tr><th>No</th><th>ID Kelas</th><th>Nama Kelas</th><th>Wali Kelas</th><th>Tahun Ajaran</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="kelasTable"><tr><td colspan="7" class="loading">Memuat...</td></tr></tbody></table></div></div></div><script src="api.js"></script><script src="auth.js"></script><script src="layout.js"></script><script src="kelas.js"></script><script src="pwa.js"></script></body></html>
