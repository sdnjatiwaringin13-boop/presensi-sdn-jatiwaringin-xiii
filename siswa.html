<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Data Siswa - Presensi</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body class="dashboard-body">


  <!-- HEADER -->

  <header class="topbar">

    <div>

      <h1>
        Data Siswa
      </h1>

      <span>
        SD Negeri Jatiwaringin XIII
      </span>

    </div>


    <div>

      <button
        class="back-button"
        onclick="location.href='admin.html'"
      >
        Dashboard
      </button>


      <button
        id="logoutButton"
        class="logout-button"
      >
        Logout
      </button>

    </div>

  </header>


  <!-- CONTENT -->

  <main class="dashboard-container">


    <section class="panel">


      <div class="page-header">

        <div>

          <h2>
            Daftar Siswa
          </h2>

          <p>
            Data siswa dari Google Spreadsheet
          </p>

        </div>


        <div
          id="jumlahSiswa"
          class="jumlah-data"
        >
          0 siswa
        </div>

      </div>


      <!-- FILTER -->

      <div class="filter-area">


        <input
          type="text"
          id="searchInput"
          placeholder="Cari nama atau NISN..."
        >


        <select id="kelasFilter">

          <option value="">
            Semua Kelas
          </option>

        </select>


      </div>


      <!-- TABLE -->

      <div class="table-wrapper">

        <table>

          <thead>

            <tr>

              <th>
                No
              </th>

              <th>
                ID
              </th>

              <th>
                NISN
              </th>

              <th>
                Nama
              </th>

              <th>
                Kelas
              </th>

              <th>
                Jenis Kelamin
              </th>

              <th>
                Status
              </th>

            </tr>

          </thead>


          <tbody id="siswaTable">

            <tr>

              <td
                colspan="7"
                class="loading"
              >
                Memuat data siswa...
              </td>

            </tr>

          </tbody>

        </table>

      </div>


    </section>


  </main>


  <!-- JAVASCRIPT -->

  <script src="./siswa.js"></script>


</body>

</html>
