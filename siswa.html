<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Data Siswa</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="style.css"></head><body><div class="card"><div class="card-header"><div class="card-title"><i class="fa-solid fa-user-graduate"></i> Data Siswa</div><button id="tambahButton" class="btn btn-primary" type="button">Tambah Siswa</button></div><div class="card-body"><div class="toolbar"><input id="searchInput" placeholder="Cari nama, NISN, atau ID..."><select id="kelasFilter"><option value="">Semua Kelas</option></select><button id="refreshButton" class="btn btn-secondary" type="button">Refresh</button><span id="jumlahSiswa" class="data-count">0 siswa</span></div><div id="formSiswa" style="display:none" class="form-container"><h3 id="formTitle">Tambah Siswa</h3><form id="siswaForm"><div class="form-grid"><div class="form-group"><label>ID Siswa</label><input id="inputID" required></div><div class="form-group"><label>NISN</label><input id="inputNISN" required></div><div class="form-group"><label>Nama</label><input id="inputNama" required></div><div class="form-group"><label>Kelas</label><input id="inputKelas" required></div><div class="form-group"><label>JK</label><select id="inputJK" required><option value="">Pilih</option><option value="L">Laki-laki</option><option value="P">Perempuan</option></select></div><div class="form-group"><label>Status</label><select id="inputStatus"><option value="AKTIF">AKTIF</option><option value="NONAKTIF">NONAKTIF</option></select></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">Simpan</button><button id="cancelButton" class="btn btn-secondary" type="button">Batal</button></div></form></div><div class="table-responsive"><table><thead><tr><th>No</th><th>ID</th><th>NISN</th><th>Nama</th><th>Kelas</th><th>JK</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="siswaTable"><tr><td colspan="8" class="loading">Memuat...</td></tr></tbody></table></div></div></div><script src="api.js"></script><script src="auth.js"></script><script src="layout.js"></script><script src="siswa.js"></script><script src="pwa.js"></script></body></html>
