<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Data Siswa - Presensi</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="layout.css">

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

</head>


<body>

<!-- SIDEBAR -->

<aside id="sidebar"></aside>


<!-- AREA UTAMA -->

<div class="main-wrapper">


  <!-- TOPBAR -->

  <header id="topbar"></header>


  <!-- CONTENT -->

  <main class="page-content">


    <div class="breadcrumb">

      <i class="fa-solid fa-house"></i>

      <span>Dashboard</span>

      <i class="fa-solid fa-angle-right"></i>

      <span>Data Siswa</span>

    </div>


    <section class="content-card">


      <div class="content-header">

        <div>

          <h2>
            <i class="fa-solid fa-user-graduate"></i>
            Data Siswa
          </h2>

        </div>


        <button
          id="tambahButton"
          class="btn-primary"
        >

          <i class="fa-solid fa-plus"></i>

          Tambah Siswa

        </button>

      </div>


      <!-- FORM -->

      <div
        id="formSiswa"
        class="form-container"
        style="display:none"
      >

        <div class="form-title">

          <h3 id="formTitle">
            Tambah Siswa
          </h3>

        </div>


        <form id="siswaForm">

          <div class="form-grid">


            <div class="form-group">

              <label>
                ID Siswa
              </label>

              <input
                type="text"
                id="inputID"
                required
              >

            </div>


            <div class="form-group">

              <label>
                NISN
              </label>

              <input
                type="text"
                id="inputNISN"
                required
              >

            </div>


            <div class="form-group">

              <label>
                Nama Siswa
              </label>

              <input
                type="text"
                id="inputNama"
                required
              >

            </div>


            <div class="form-group">

              <label>
                Kelas
              </label>

              <input
                type="text"
                id="inputKelas"
                required
              >

            </div>


            <div class="form-group">

              <label>
                Jenis Kelamin
              </label>

              <select
                id="inputJK"
                required
              >

                <option value="">
                  Pilih
                </option>

                <option value="L">
                  Laki-laki
                </option>

                <option value="P">
                  Perempuan
                </option>

              </select>

            </div>


            <div class="form-group">

              <label>
                Status
              </label>

              <select
                id="inputStatus"
                required
              >

                <option value="AKTIF">
                  AKTIF
                </option>

                <option value="NONAKTIF">
                  NONAKTIF
                </option>

              </select>

            </div>


          </div>


          <div class="form-actions">

            <button
              type="submit"
              class="btn-primary"
            >

              <i class="fa-solid fa-save"></i>

              Simpan

            </button>


            <button
              type="button"
              id="cancelButton"
              class="btn-secondary"
            >

              Batal

            </button>

          </div>

        </form>

      </div>


      <!-- FILTER -->

      <div class="filter-row">

        <input
          type="text"
          id="searchInput"
          placeholder="Cari nama atau NISN..."
        >


        <select id="kelasFilter">

          <option value="">
            Semua Kelas
          </option>

        </select>


        <button
          id="refreshButton"
          class="btn-secondary"
        >

          <i class="fa-solid fa-rotate"></i>

          Refresh

        </button>


        <span
          id="jumlahSiswa"
          class="data-count"
        >

          0 siswa

        </span>

      </div>


      <!-- TABLE -->

      <div class="table-responsive">

        <table>

          <thead>

            <tr>

              <th>No</th>

              <th>ID</th>

              <th>NISN</th>

              <th>Nama</th>

              <th>Kelas</th>

              <th>JK</th>

              <th>Status</th>

              <th>Aksi</th>

            </tr>

          </thead>


          <tbody id="siswaTable">

            <tr>

              <td
                colspan="8"
                class="loading"
              >

                Memuat data siswa...

              </td>

            </tr>

          </tbody>

        </table>

      </div>


    </section>


  </main>

</div>


<!-- JAVASCRIPT -->

<script src="api.js"></script>

<script src="layout.js"></script>

<script src="siswa.js"></script>


</body>

</html>
