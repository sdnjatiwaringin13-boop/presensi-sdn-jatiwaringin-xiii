<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Data Siswa - Presensi</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body class="dashboard-body">


<header class="topbar">

  <div>

    <h1>
      Data Siswa
    </h1>

    <span>
      SD Negeri Jatiwaringin XIII
    </span>

  </div>


  <div>

    <button
      class="back-button"
      onclick="location.href='admin.html'"
    >
      Dashboard
    </button>


    <button
      id="logoutButton"
      class="logout-button"
    >
      Logout
    </button>

  </div>

</header>



<main class="dashboard-container">


  <!-- FORM SISWA -->

  <section
    id="formSiswa"
    class="panel"
    style="display:none;"
  >

    <div class="panel-header">

      <h2 id="formTitle">
        Tambah Siswa
      </h2>

    </div>


    <form id="siswaForm">


      <div class="form-grid">


        <div>

          <label for="inputID">
            ID Siswa
          </label>

          <input
            type="text"
            id="inputID"
            placeholder="Contoh: S005"
            required
          >

        </div>


        <div>

          <label for="inputNISN">
            NISN
          </label>

          <input
            type="text"
            id="inputNISN"
            placeholder="Masukkan NISN"
            required
          >

        </div>


        <div>

          <label for="inputNama">
            Nama Siswa
          </label>

          <input
            type="text"
            id="inputNama"
            placeholder="Nama lengkap"
            required
          >

        </div>


        <div>

          <label for="inputKelas">
            Kelas
          </label>

          <input
            type="text"
            id="inputKelas"
            placeholder="Contoh: 1A"
            required
          >

        </div>


        <div>

          <label for="inputJK">
            Jenis Kelamin
          </label>

          <select id="inputJK" required>

            <option value="">
              Pilih
            </option>

            <option value="L">
              Laki-laki
            </option>

            <option value="P">
              Perempuan
            </option>

          </select>

        </div>


        <div>

          <label for="inputStatus">
            Status
          </label>

          <select id="inputStatus" required>

            <option value="AKTIF">
              AKTIF
            </option>

            <option value="NONAKTIF">
              NONAKTIF
            </option>

          </select>

        </div>


      </div>


      <div class="form-actions">

        <button
          type="submit"
          class="primary-button"
        >
          Simpan
        </button>


        <button
          type="button"
          id="cancelButton"
          class="secondary-button"
        >
          Batal
        </button>

      </div>


    </form>

  </section>



  <!-- DATA SISWA -->

  <section class="panel">


    <div class="page-header">

      <div>

        <h2>
          Daftar Siswa
        </h2>

        <p>
          Data siswa dari Google Spreadsheet
        </p>

      </div>


      <div>

        <span
          id="jumlahSiswa"
          class="jumlah-data"
        >
          0 siswa
        </span>


        <button
          id="tambahButton"
          class="primary-button"
        >
          + Tambah Siswa
        </button>

      </div>

    </div>



    <!-- FILTER -->

    <div class="filter-area">


      <input
        type="text"
        id="searchInput"
        placeholder="Cari nama atau NISN..."
      >


      <select id="kelasFilter">

        <option value="">
          Semua Kelas
        </option>

      </select>


      <button
        id="refreshButton"
        class="secondary-button"
      >
        🔄 Refresh
      </button>


    </div>



    <!-- TABLE -->

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>

            <th>No</th>

            <th>ID</th>

            <th>NISN</th>

            <th>Nama</th>

            <th>Kelas</th>

            <th>JK</th>

            <th>Status</th>

            <th>Aksi</th>

          </tr>

        </thead>


        <tbody id="siswaTable">

          <tr>

            <td
              colspan="8"
              class="loading"
            >
              Memuat data siswa...
            </td>

          </tr>

        </tbody>

      </table>

    </div>


  </section>


</main>


<script src="./siswa.js"></script>


</body>

</html>
