<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Data Siswa - Presensi SDN Jatiwaringin XIII
    </title>


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- ==========================================
         KONTEN SISWA
         Konten lama tetap dipertahankan
    =========================================== -->

    <div class="card">

        <div class="card-header">

            <div class="card-title">

                <i class="fa-solid fa-user-graduate"></i>

                Data Siswa

            </div>

            <button
                type="button"
                id="btnTambah"
                class="btn btn-primary"
            >

                <i class="fa-solid fa-plus"></i>

                Tambah Siswa

            </button>

        </div>


        <div class="card-body">

            <!--
                Tempatkan konten siswa.js
                yang sudah ada di sini.
            -->

            <div
                id="siswaMessage"
            ></div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                No
                            </th>

                            <th>
                                ID
                            </th>

                            <th>
                                NISN
                            </th>

                            <th>
                                Nama
                            </th>

                            <th>
                                Kelas
                            </th>

                            <th>
                                JK
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Aksi
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="siswaTableBody"
                    >

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script src="auth.js"></script>
    <script src="layout.js"></script>
    <script src="siswa.js"></script>
    <script src="pwa.js"></script>

</body>

</html>
