<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard - Presensi Siswa</title>

  <meta name="theme-color" content="#1565c0">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">

    <div class="topbar-left">
      <div class="topbar-logo">SD</div>

      <div>
        <div class="topbar-title">
          Presensi Siswa
        </div>

        <div class="topbar-school">
          SD Negeri Jatiwaringin XIII
        </div>
      </div>
    </div>

    <div class="topbar-right">

      <div class="user-info">
        <strong id="dashboardUserName">-</strong>
        <span id="dashboardRole">-</span>
      </div>

      <button
        type="button"
        class="btn btn-danger btn-small"
        onclick="Auth.logout()"
      >
        Keluar
      </button>

    </div>

  </header>


  <main class="container">

    <div class="page-header">

      <div>
        <h1>Dashboard</h1>

        <p id="dashboardGreeting">
          Selamat datang.
        </p>
      </div>

    </div>


    <!-- INFORMASI GURU -->

    <section
      id="guruInfoCard"
      class="card"
      style="display:none;"
    >

      <div class="card-header">
        <h2>Informasi Guru</h2>
      </div>

      <div class="info-grid">

        <div class="info-item">
          <span>Nama Guru</span>
          <strong id="guruName">-</strong>
        </div>

        <div class="info-item">
          <span>Kelas</span>
          <strong id="guruClass">-</strong>
        </div>

      </div>

    </section>


    <!-- STATISTIK ADMIN -->

    <section
      id="adminStats"
      style="display:none;"
    >

      <div class="section-title">
        <h2>Data Sekolah</h2>
      </div>

      <div class="stats-grid">

        <div class="stat-card">
          <div class="stat-icon">👨‍🎓</div>

          <div>
            <span>Total Siswa</span>
            <strong id="totalSiswa">0</strong>
          </div>
        </div>


        <div class="stat-card">
          <div class="stat-icon">👨‍🏫</div>

          <div>
            <span>Total Guru</span>
            <strong id="totalGuru">0</strong>
          </div>
        </div>


        <div class="stat-card">
          <div class="stat-icon">🏫</div>

          <div>
            <span>Total Kelas</span>
            <strong id="totalKelas">0</strong>
          </div>
        </div>

      </div>

    </section>


    <!-- ABSENSI HARI INI -->

    <section class="card">

      <div class="card-header">
        <h2>Presensi Hari Ini</h2>

        <span id="tanggalHariIni"></span>
      </div>


      <div class="attendance-grid">

        <div class="attendance-card hadir">
          <span>Hadir</span>
          <strong id="attendanceHadir">0</strong>
        </div>

        <div class="attendance-card izin">
          <span>Izin</span>
          <strong id="attendanceIzin">0</strong>
        </div>

        <div class="attendance-card sakit">
          <span>Sakit</span>
          <strong id="attendanceSakit">0</strong>
        </div>

        <div class="attendance-card alpa">
          <span>Alpa</span>
          <strong id="attendanceAlpa">0</strong>
        </div>

      </div>

    </section>


    <!-- MENU -->

    <section>

      <div class="section-title">
        <h2>Menu</h2>
      </div>

      <div
        id="menuGrid"
        class="menu-grid"
      ></div>

    </section>

  </main>


  <script src="auth.js"></script>
  <script src="dashboard.js"></script>
  <script src="pwa.js"></script>

</body>
</html>
